<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF14 Tracker — こてつ</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  /* DESIGN.md ステージダーク準拠（2026-07-06リスキン・vaultroomビジュアル言語） */
  --bg:#1C1626;--bg2:#241C30;--bg3:#2E2540;--bg4:#382E4A;
  --border:#14110F;--border2:#3A324A;
  --accent:#66CFF2;--accent2:#14110F;
  --gold:#F5A623;--gold2:#8a6a1e;
  --green:#4FA85C;--green2:#2f6e39;
  --red:#F04F30;--red2:#7a2418;
  --pink:#F27CA0;--apr:#F5B57C;--ink:#14110F;
  --text:#F2F0EC;--text2:#B9AEC4;--text3:#8A7EA0;
  --mono:'Share Tech Mono',monospace;
  --sans:'Zen Kaku Gothic New',sans-serif;
  --round:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;min-height:100vh;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* HEADER */
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;}
.logo{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.1em;white-space:nowrap;}
.logo span{color:var(--gold);}
.nav{display:flex;gap:3px;flex:1;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.nav::-webkit-scrollbar{display:none;}
.nav-btn{background:none;border:1px solid transparent;color:var(--text2);padding:5px 13px;border-radius:4px;cursor:pointer;font-family:var(--sans);font-size:13px;transition:all .12s;white-space:nowrap;flex-shrink:0;}
.nav-btn:hover{color:var(--text);border-color:var(--border2);background:var(--bg3);}
.nav-btn.active{color:var(--ink);border-color:var(--ink);background:var(--accent);box-shadow:2px 2px 0 var(--ink);font-weight:700;}
.gp{font-family:var(--mono);font-size:11px;color:var(--text3);white-space:nowrap;}
.gp b{color:var(--green);}

/* MAIN */
.main{padding:18px 20px;max-width:1200px;margin:0 auto;}
.tab-content{display:none;}
.tab-content.active{display:block;}
/* 収集タブ内サブナビ */
.sub-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
.sub-btn{background:var(--bg3);border:2px solid var(--border);color:var(--text);padding:5px 15px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:700;font-family:var(--sans);box-shadow:2px 2px 0 var(--ink);transition:transform .08s,box-shadow .08s;}
.sub-btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink);}
.sub-btn.active{color:var(--ink);background:var(--accent);}
.sub-content{display:none;}
.sub-content.active{display:block;}
/* 装備更新トラッカー（ジョブタブ） */
.gear-legend{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.gear-wrap{overflow-x:auto;margin-bottom:18px;border:2px solid var(--border);border-radius:10px;box-shadow:4px 4px 0 var(--ink);}
.gear-tbl{border-collapse:collapse;width:100%;font-size:12px;}
.gear-tbl th{background:var(--bg3);color:var(--text2);font-family:var(--mono);font-size:10px;padding:6px 4px;white-space:nowrap;border-bottom:2px solid var(--border);text-align:center;}
.gear-tbl td{padding:3px 4px;text-align:center;border-bottom:1px solid #2A2238;}
.gear-tbl .gear-job{text-align:left;position:sticky;left:0;background:var(--bg2);white-space:nowrap;padding:5px 8px;z-index:1;border-right:2px solid var(--border);width:190px;}
.gear-tbl th.gear-job{background:var(--bg3);}
.gear-tbl .gear-job .job-icon-wrap{width:100%;}
.gear-jn{font-size:13px;}
.gear-cell{display:inline-block;border:2px solid var(--ink);border-radius:6px;color:var(--ink);font-weight:700;font-size:10px;padding:2px 6px;box-shadow:1px 1px 0 var(--ink);font-family:var(--sans);}
.gear-sel{border:2px solid var(--ink);border-radius:6px;color:var(--ink);font-weight:700;font-size:10px;padding:2px 3px;cursor:pointer;box-shadow:1px 1px 0 var(--ink);min-width:70px;font-family:var(--sans);text-align:center;text-align-last:center;}
.gear-sel:hover{box-shadow:2px 2px 0 var(--ink);}
.gear-lv{font-family:var(--mono);font-size:11px;color:var(--text3);margin-left:auto;padding-left:8px;flex-shrink:0;}
.gear-lv.lv-max{color:var(--gold);}
.exp-arrow{color:var(--text3);font-size:10px;width:11px;flex-shrink:0;}
.gear-exp>td{background:var(--bg3);padding:9px 14px;border-bottom:2px solid var(--border);position:sticky;left:0;}
.gear-exp-inner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.exp-lbl{font-family:var(--mono);font-size:11px;color:var(--text2);}
.gear-exp-body{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;}
.need-chip{background:var(--accent);color:var(--ink);border:2px solid var(--ink);border-radius:6px;padding:2px 8px;font-weight:700;font-size:11px;box-shadow:1px 1px 0 var(--ink);}
.need-note{background:var(--gold);color:var(--ink);border:2px solid var(--ink);border-radius:6px;padding:2px 8px;font-size:10px;font-weight:700;box-shadow:1px 1px 0 var(--ink);}

/* 黄金極攻略タブ */
.gx-tbl{border-collapse:collapse;width:100%;font-size:13px;}
.gx-tbl th{background:var(--bg3);color:var(--text2);font-family:var(--mono);font-size:10px;padding:7px 8px;white-space:nowrap;border-bottom:2px solid var(--border);text-align:left;}
.gx-tbl td{padding:6px 8px;border-bottom:1px solid #2A2238;vertical-align:middle;}
.gx-tbl tr:hover td{background:var(--bg2);}
.gx-time{font-family:var(--mono);font-size:12px;color:var(--text3);white-space:nowrap;width:48px;text-align:right;padding-right:12px;}
.gx-w1{font-weight:800;}
.gx-w2{font-weight:800;color:var(--red);}
.gx-dim{color:var(--text3);}
.gx-mit{width:100%;min-width:150px;background:var(--bg3);border:1.5px solid var(--border2);border-radius:6px;color:var(--text);padding:4px 8px;font-size:12px;font-family:var(--sans);box-sizing:border-box;}
.gx-mit:focus{border-color:var(--accent);outline:none;}
.gx-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;padding:2px 5px;}
.gx-del:hover{color:var(--red);}
.gx-notes{background:var(--bg2);border:1.5px solid var(--border2);border-radius:8px;padding:8px 12px;font-size:11.5px;color:var(--text2);line-height:1.6;margin-bottom:12px;}
.gx-link{display:inline-flex;align-items:center;gap:6px;background:var(--bg3);border:2px solid var(--border);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--accent);text-decoration:none;box-shadow:2px 2px 0 var(--ink);}
.gx-link:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink);}
.gx-link .gx-del{padding:0 0 0 2px;}

/* SECTION */
.sec-title{font-family:var(--round);font-weight:900;font-size:15px;letter-spacing:.02em;color:var(--text);padding:4px 0 7px 11px;border-left:5px solid var(--accent);border-bottom:2px solid var(--border);margin-bottom:12px;margin-top:24px;display:flex;justify-content:space-between;align-items:center;}
.sec-title:first-child{margin-top:0;}
.sec-cnt{font-size:11px;color:var(--text3);}
.sec-cnt b{color:var(--green);}

/* FILTER ROW */
.filter-row{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
.filter-btn{background:var(--bg3);border:2px solid var(--border);color:var(--text);padding:4px 11px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;font-family:var(--sans);box-shadow:2px 2px 0 var(--ink);transition:transform .08s,box-shadow .08s;}
.filter-btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink);}
.filter-btn.active{color:var(--ink);background:var(--accent);box-shadow:2px 2px 0 var(--ink);}
.show-done-toggle{margin-left:auto;font-size:12px;color:var(--text3);display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;}
.show-done-toggle input{accent-color:var(--accent);}

/* TODO */
.todo-grid{display:flex;flex-direction:column;gap:2px;margin-bottom:6px;}
.todo-item{display:flex;align-items:flex-start;gap:9px;padding:7px 9px;border-radius:4px;border:1px solid transparent;cursor:pointer;transition:all .12s;user-select:none;}
.todo-item:hover{background:var(--bg3);border-color:var(--border);}
.todo-item.done{opacity:.3;}
.todo-item.done .ti-name{text-decoration:line-through;}
.chk{width:15px;height:15px;border:1.5px solid var(--border2);border-radius:3px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .12s;}
.todo-item.done .chk{background:var(--green2);border-color:var(--green);}
.chk-mark{display:none;color:var(--green);font-size:10px;line-height:1;}
.todo-item.done .chk-mark{display:block;}
.ti-name{font-size:13px;color:var(--text);flex:1;}
.ti-sub{font-size:11px;color:var(--text3);margin-top:1px;}
.badge{font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;flex-shrink:0;margin-top:2px;color:var(--ink);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);}
.b-weekly{background:var(--accent);}
.b-once{background:var(--green);}
.b-ongoing{background:var(--gold);}

/* JOB TABLE */
.job-tbl{width:100%;border-collapse:collapse;}
.job-tbl th{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--text3);text-align:left;padding:6px 10px;border-bottom:1px solid var(--border);}
.job-tbl td{padding:6px 10px;border-bottom:1px solid #0e1520;font-size:13px;vertical-align:middle;}
.job-tbl tr:hover td{background:var(--bg3);}
.role-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;font-family:var(--mono);display:inline-block;color:var(--ink);border:2px solid var(--ink);box-shadow:1px 1px 0 var(--ink);}
.r-tank  {background:var(--accent);}
.r-healer{background:var(--green);}
.r-dps   {background:var(--red);}
.lv-bar-wrap{width:70px;height:4px;background:var(--bg4);border-radius:2px;display:inline-block;vertical-align:middle;margin-left:5px;}
.lv-bar{height:100%;border-radius:2px;transition:width .3s;}
.lv-gold{background:var(--gold);}
.lv-grn {background:var(--green);}
.lv-blu {background:var(--accent);}
.lv-red {background:var(--red);}
.lv-num{font-family:var(--mono);font-size:13px;}

/* Tier select */
.tier-sel{background:var(--bg4);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:11px;padding:3px 6px;border-radius:3px;cursor:pointer;transition:border-color .12s;width:100%;}
.tier-sel:hover{border-color:var(--border2);}
.tier-sel:focus{outline:none;border-color:var(--accent2);}

/* Job icon — circle fallback */
.job-icon-wrap{display:flex;align-items:center;gap:8px;}
.job-icon{width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0;}
.job-icon-fb{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:0;border:1px solid;}

/* WEAPON TABLE */
.weapon-tbl{width:100%;border-collapse:collapse;}
.weapon-tbl th{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--text3);text-align:left;padding:5px 10px;border-bottom:1px solid var(--border);}
.weapon-tbl td{padding:6px 10px;border-bottom:1px solid #0e1520;font-size:13px;vertical-align:middle;}
.weapon-tbl tr:hover td{background:var(--bg3);}
.weapon-tbl tr.done-row{opacity:.35;}
.status-sel{background:var(--bg4);border:2px solid var(--ink);color:var(--text);font-family:var(--mono);font-size:11px;padding:3px 6px;border-radius:6px;cursor:pointer;box-shadow:1px 1px 0 var(--ink);}
.status-sel:hover{border-color:var(--border2);}
.status-sel:focus{outline:none;border-color:var(--accent2);}
.note-input{background:none;border:none;color:var(--text2);font-family:var(--sans);font-size:12px;width:100%;outline:none;border-bottom:1px solid transparent;transition:border-color .12s;}
.note-input:hover,.note-input:focus{border-bottom-color:var(--border2);}

/* GLAMOUR */
.glamour-section{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:700px){.glamour-section{grid-template-columns:1fr;}}
.glam-card{background:var(--bg2);border:2px solid var(--ink);border-radius:10px;overflow:hidden;box-shadow:4px 4px 0 var(--ink);}
.glam-header{background:var(--bg3);border-bottom:1px solid var(--border);padding:9px 13px;display:flex;align-items:center;gap:8px;}
.glam-job{font-weight:700;font-size:14px;}
/* ジョブ別ミラプリ（スクショ枠） */
.gj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.gj-card{background:var(--bg2);border:2px solid var(--ink);border-radius:10px;overflow:hidden;box-shadow:4px 4px 0 var(--ink);display:flex;flex-direction:column;}
.gj-head{display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--bg3);border-bottom:1px solid var(--border);}
.gj-head img{width:20px;height:20px;flex:none;}
.gj-name{font-weight:700;font-size:12px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gj-img{position:relative;aspect-ratio:3/4;background:var(--bg3);cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.gj-img img{width:100%;height:100%;object-fit:cover;display:block;}
.gj-img:hover .gj-empty{color:var(--accent);}
.gj-empty{color:var(--text3);font-size:11.5px;font-weight:700;text-align:center;line-height:1.6;padding:8px;}
.gj-memo{font-size:11px;color:var(--text2);padding:5px 8px;min-height:24px;cursor:pointer;border-top:1px solid var(--border);white-space:pre-wrap;word-break:break-word;}
.gj-memo.empty{color:var(--text3);}
.glam-cnt{font-family:var(--mono);font-size:11px;color:var(--text3);margin-left:auto;}
.glam-cnt b{color:var(--green);}
.glam-url{font-family:var(--mono);font-size:10px;color:var(--accent);text-decoration:none;}
.glam-url:hover{text-decoration:underline;}
.glam-piece{display:flex;align-items:center;gap:9px;padding:6px 13px;border-bottom:1px solid #0e1520;cursor:pointer;transition:background .1s;}
.glam-piece:last-child{border-bottom:none;}
.glam-piece:hover{background:var(--bg3);}
.glam-piece.done{opacity:.35;}
.glam-piece.done .gp-name{text-decoration:line-through;}
.gp-slot{font-family:var(--mono);font-size:10px;color:var(--text3);width:32px;flex-shrink:0;}
.gp-name{font-size:13px;flex:1;}
.gp-src{font-size:11px;color:var(--text3);}
.gp-chk{width:13px;height:13px;border-radius:2px;border:1px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.glam-piece.done .gp-chk{background:var(--green2);border-color:var(--green);}
.gp-chk-mark{display:none;color:var(--green);font-size:9px;line-height:1;}
.glam-piece.done .gp-chk-mark{display:block;}
/* SITES */
.sites-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.site-card{background:var(--bg2);border:2px solid var(--ink);border-radius:10px;overflow:hidden;text-decoration:none;color:var(--text);display:flex;flex-direction:column;transition:transform .1s,box-shadow .1s;cursor:pointer;box-shadow:4px 4px 0 var(--ink);}
.site-card:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink);}
.site-thumb{width:100%;height:100px;object-fit:cover;display:block;background:var(--bg4);}
.site-thumb-fb{width:100%;height:100px;display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--bg4);flex-shrink:0;}
.site-body{padding:10px 12px;flex:1;display:flex;flex-direction:column;gap:4px;}
.site-name{font-size:13px;font-weight:500;color:var(--text);}
.site-url{font-family:var(--mono);font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.site-desc{font-size:12px;color:var(--text2);line-height:1.5;margin-top:2px;}
.site-tag{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:2px;display:inline-block;margin-top:auto;align-self:flex-start;}
.site-tag{color:var(--ink)!important;border:2px solid var(--ink)!important;box-shadow:1px 1px 0 var(--ink);font-weight:700;border-radius:6px;}
.st-wiki    {background:var(--accent);}
.st-tool    {background:var(--green);}
.st-market  {background:var(--gold);}
.st-glam    {background:var(--pink);}
.st-craft   {background:var(--apr);}
.st-hunt    {background:var(--red);}
.st-blue    {background:var(--accent);}
.st-end     {background:var(--pink);}
#modal-body label{display:block;font-family:var(--mono);font-size:11px;color:var(--text3);margin-bottom:4px;}

/* クリア進捗（アチーブ逆引きv2・2026-07-15） */
.cp-sec{margin-bottom:26px;}
.cp-cnt{font-family:var(--mono);font-size:12px;color:var(--text3);font-weight:400;margin-left:10px;}
.cp-exp{font-family:var(--mono);font-size:11px;color:var(--text3);margin:10px 0 6px;letter-spacing:.08em;}
.cp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 14px;}
.cp-row{display:flex;align-items:center;gap:8px;padding:3px 6px;border-radius:4px;font-size:12.5px;min-width:0;}
.cp-row.clr{color:var(--text3);}
.cp-row.clr .cp-name{text-decoration:line-through;text-decoration-color:var(--border2);}
.cp-mark{font-family:var(--mono);font-weight:700;width:14px;flex:none;text-align:center;}
.cp-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
@media (max-width: 768px) {
  .header{padding:8px 12px;gap:8px;flex-wrap:wrap;}
  .logo{font-size:11px;}
  .main{padding:12px;}
  /* タブナビ: 横スクロール→3列グリッド（全タブ常時可視・2026-07-15 発注B項） */
  .nav{order:10;width:100%;flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;overflow-x:visible;}
  .nav-btn{padding:8px 4px;font-size:12px;text-align:center;border-color:var(--border);background:var(--bg2);}
  .job-tbl,.weapon-tbl{display:block;overflow-x:auto;}
  .glamour-section{grid-template-columns:1fr;}
  .sites-grid{grid-template-columns:1fr 1fr;}
  #sync-status{display:none;}
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">FF14 <span>TRACKER</span> // こてつ</div>
  <nav class="nav">
    <button class="nav-btn active" onclick="switchTab('todo',this)">やることリスト</button>
    <button class="nav-btn" onclick="switchTab('jobs',this)">ジョブ</button>
    <button class="nav-btn" onclick="switchTab('weapons',this)">光る武器</button>
    <button class="nav-btn" onclick="switchTab('gogoku',this)">黄金極</button>
    <button class="nav-btn" onclick="switchTab('clearprog',this)">クリア進捗</button>
    <button class="nav-btn" onclick="switchTab('glamour',this)">ミラプリ</button>
    <button class="nav-btn" onclick="switchTab('sites',this)">便利サイト</button>
    <button class="nav-btn" onclick="switchTab('collect',this)">収集</button>
  </nav>
  <div class="gp" id="gp">—</div>
  <span id="sync-status" style="font-family:var(--mono);font-size:11px;margin-left:8px"></span>
  <button onclick="cloudLoad()" style="background:none;border:1px solid var(--border);color:var(--text3);font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:3px;cursor:pointer;margin-left:4px" title="クラウドから読み込み">↓ 読込</button>
</div>

<div class="main">
  <div class="tab-content active" id="tab-todo"></div>
  <div class="tab-content" id="tab-jobs"></div>
  <div class="tab-content" id="tab-weapons"></div>
  <div class="tab-content" id="tab-gogoku"></div>
  <div class="tab-content" id="tab-clearprog"></div>
  <div class="tab-content" id="tab-glamour"></div>
  <div class="tab-content" id="tab-sites"></div>
  <div class="tab-content" id="tab-collect">
    <div class="sub-nav">

// Weekly reset tracking: store ISO week string "YYYY-Www"
function isoWeek() {
  const d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 3 - (d.getDay()+6)%7);
  const w = new Date(d.getFullYear(),0,4);
  return d.getFullYear()+'W'+String(Math.round(((d-w)/86400000-3+(w.getDay()+6)%7)/7)+1).padStart(2,'0');
}
if (S.lastWeek !== isoWeek()) {
  // auto-reset weekly items on new week
  S.todos.forEach(t => { if (t.type==='weekly') delete S[t.id]; });
  S.lastWeek = isoWeek();
}

// デプロイ後にWorkerのURLを設定する
const WORKER_URL = 'https://ff14-tracker-sync.kote2-89f.workers.dev';

let syncStatus = 'idle'; // idle / syncing / ok / error
let syncTimer = null;

function save() {
  try { localStorage.setItem('ff14t_v3', JSON.stringify(S)); }
  catch(e) { alert('ブラウザ保存の容量を超えた（ミラプリ画像の入れすぎが原因の可能性）。どれか画像を削除してください。クラウド同期は継続します'); }
  // Worker URLが設定されていたら自動クラウド同期（debounce 2秒）
  if (WORKER_URL) {
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => cloudSync(), 2000);
    setSyncStatus('pending');
  }
}

function setSyncStatus(s) {
  syncStatus = s;
  const el = document.getElementById('sync-status');
  if (!el) return;
  const map = {
    idle:    { text:'', color:'var(--text3)' },
    pending: { text:'● 保存待ち', color:'var(--gold)' },
    syncing: { text:'↑ 同期中…', color:'var(--accent)' },
    ok:      { text:'✓ 同期済み', color:'var(--green)' },
    error:   { text:'✕ 同期失敗', color:'var(--red)' },
  };
  const m = map[s] || map.idle;
  el.textContent = m.text;
  el.style.color = m.color;
}

async function cloudSync() {
  if (!WORKER_URL) return;
  setSyncStatus('syncing');
  try {
    // Stateをフラットなkey-valueに変換（巨大なtodos/glamoursはJSON文字列化）
    const payload = {};
    for (const [k, v] of Object.entries(S)) {
      payload[k] = typeof v === 'object' ? JSON.stringify(v) : String(v);
    }
    const res = await fetch(`${WORKER_URL}/sync`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error(res.status);
    setSyncStatus('ok');
  } catch(e) {
    setSyncStatus('error');
  }
}

async function cloudLoad() {
  if (!WORKER_URL) return;
  setSyncStatus('syncing');
  try {
    const res = await fetch(`${WORKER_URL}/sync`);
    const data = await res.json();
    for (const [k, {value}] of Object.entries(data)) {
      // JSON文字列かどうか判定して復元
      try { S[k] = JSON.parse(value); }
      catch { S[k] = value === 'true' ? true : value === 'false' ? false : value; }
    }
    localStorage.setItem('ff14t_v3', JSON.stringify(S));
    setSyncStatus('ok');
  } catch(e) {
    setSyncStatus('error');
  }
}

const EXP = {}; // ジョブ展開状態（保存しない）
// 部位カテゴリ＋必要素材テーブル（Reisende Croco記事・パッチ7.5）
function slotCat(k){ if(k==='wpn')return'wpn'; if(k==='head'||k==='hands'||k==='feet')return'armA'; if(k==='body'||k==='legs')return'armB'; return'acc'; }
const TOME={wpn:500,armA:495,armB:825,acc:375};
const HONRAI={wpn:'奔雷の強化薬',armA:'奔雷の強化繊維',armB:'奔雷の強化繊維',acc:'奔雷の硬化薬'};
const DANSHO={wpn:['第4片',8],armA:['第2片',4],armB:['第3片',6],acc:['第1片',3]};
function computeGap(j){
  const tgt=S['tgt_'+j.id]??6, need={}, notes=new Set(); let remain=0;
  const add=(k,n)=>{need[k]=(need[k]||0)+n;};
  GSLOTS.forEach(s=>{
    const cur=S['gear_'+j.id+'_'+s.k]??0; if(cur>=tgt)return; remain++;
    const cat=slotCat(s.k);
    if(tgt===1) notes.add('新式は製作/購入');
    else if(tgt===2) notes.add('新式RE＝手形G3＋強霊薬（数理の必要数は要確認）');
    else if(tgt===3){ add('記憶トークン',TOME[cat]); if(cat==='wpn')add('汎用v3.0',1); }
    else if(tgt===4) notes.add('アライアンス＝レイド周回（固定トークン要確認）');
    else if(tgt===5){ if(cur<3){add('記憶トークン',TOME[cat]); if(cat==='wpn')add('汎用v3.0',1);} add(HONRAI[cat],1); }
    else if(tgt===6){ const[p,n]=DANSHO[cat]; add('ヘビー級断章'+p,n); }
    else if(tgt===7){ if(cat==='wpn'){notes.add('PW＝ファントムウェポン強化（別途）');} else {const[p,n]=DANSHO[cat]; add('ヘビー級断章'+p,n);} }
  });
  return {tgt,need,notes:[...notes],remain};
}

  const ar=AROLE[jid]; if(!ar) return;
  const src=JOBS.find(j=>j.id===jid);
  const targets=JOBS.filter(j=>AROLE[j.id]===ar && j.id!==jid && !NO_GEAR.includes(j.id) && (S['lv_'+j.id]??j.lv)>=100);
  if(!targets.length){ alert(`${AROLE_LABEL[ar]}にLv100の他ジョブがありません（Lv100未満はコピー対象外）`); return; }
  const names=targets.map(j=>j.name).join('・');
  if(!confirm(`${src.name}の防具・アクセ（武器を除く）を ${AROLE_LABEL[ar]}のLv100ジョブ（${names}）へコピーします。\n※Lv100未満のジョブは対象外です。\n各ジョブの現在の防具は上書きされます。よろしいですか？`)) return;
  targets.forEach(t=>{
    GSLOTS.forEach(s=>{
      if(s.k==='wpn') return; // 武器はジョブ固有＝コピーしない
      S['gear_'+t.id+'_'+s.k]=S['gear_'+jid+'_'+s.k]??0;

  });

}

  let html='';
  roles.forEach(role=>{
    const jobs=JOBS.filter(j=>j.role===role);
    const rows=jobs.map(j=>{
      const lv=S['lv_'+j.id]??j.lv, rc=ROLE_COLOR[j.role], noG=NO_GEAR.includes(j.id);
      const icon=`<img src="${iconUrl(j.icon)}" width="22" height="22" style="border-radius:50%;object-fit:cover;flex-shrink:0" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="job-icon-fb" style="width:22px;height:22px;display:none;background:${rc}22;color:${rc};border-color:${rc}55">${j.abbr}</div>`;
      const arrow=noG?'':`<span class="exp-arrow">${EXP[j.id]?'▾':'▸'}</span>`;
      const jobCell=`<td class="gear-job"${noG?'':` style="cursor:pointer" onclick="toggleJob('${j.id}')"`}><div class="job-icon-wrap">${arrow}${icon}<span class="gear-jn">${j.name}</span><span class="gear-lv ${lv>=100?'lv-max':''}">Lv${lv}</span></div></td>`;
      let cells;
      if(noG){ cells=`<td colspan="${GSLOTS.length}" style="text-align:left;color:var(--text3);font-size:12px;padding-left:12px">装備管理外（レベルのみ）</td>`; }
      else {
        cells=GSLOTS.map(s=>{
          const isW=s.k==='wpn', t=S['gear_'+j.id+'_'+s.k]??0, max=isW?7:6;
          const opts=GTIERS.slice(0,max+1).map((g,i)=>`<option value="${i}"${i===t?' selected':''}>${g.n}</option>`).join('');
          return `<td><select class="gear-sel" style="background:${GTIERS[t].c}" title="${s.n}" onchange="S['gear_${j.id}_${s.k}']=parseInt(this.value);save();renderJobs()">${opts}</select></td>`;
        }).join('');
      }
      let tr=`<tr>${jobCell}${cells}</tr>`;
      if(!noG && EXP[j.id]) tr+=expandRow(j);
      return tr;
    }).join('');
    html+=`<div class="sec-title">${roleLabel[role]}</div>
      <div class="gear-wrap"><table class="gear-tbl"><thead><tr><th class="gear-job">ジョブ</th>${GSLOTS.map(s=>`<th>${s.n}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
  });
  document.getElementById('tab-jobs').innerHTML = btn + legend + html;
}

async function lodestoneSync() {
  const btn = document.getElementById('lodestone-btn');
  if (btn) btn.textContent = '↓ 取得中…';
  try {
    const res = await fetch(`${WORKER_URL}/lodestone/${LODESTONE_ID}`);
    const data = await res.json();
    if (!data.ok) throw new Error('failed');
    let updated = 0;
    for (const [name, lv] of Object.entries(data.jobs)) {
      const id = LODESTONE_NAME_MAP[name];
      if (id) { S['lv_'+id] = lv; updated++; }
    }
    save();
    renderJobs();
    if (btn) btn.textContent = `✓ ${updated}ジョブ更新`;
    setTimeout(() => { if (btn) btn.textContent = '↓ Lodestoneから更新'; }, 3000);
  } catch(e) {
    if (btn) btn.textContent = '✕ 取得失敗';
    setTimeout(() => { if (btn) btn.textContent = '↓ Lodestoneから更新'; }, 3000);
  }
}

// ---- Lodestone逆引き同期 v1（2026-07-13）----
// マウント/ミニオンの取得状況をLodestone公開ページから逆引きして自動チェック。
// Worker側ルート /lode/{mount|minion}/:id が必要（ff14-worker側に別途追加）。
// 方針: ①チェックは足すだけ（外さない） ②適用前に件数＋内訳のconfirm（検収） ③名前不一致はconsoleに残す
async function collLodestoneSync(kind) {
  const btn = document.getElementById('coll-lode-' + kind);
  const reset = t => { if (btn) { btn.textContent = t; setTimeout(() => { btn.textContent = '↓ Lodestoneから反映'; }, 4000); } };
  if (btn) btn.textContent = '↓ 取得中…';
  try {
    const res = await fetch(`${WORKER_URL}/lode/${kind}/${LODESTONE_ID}`);
    const data = await res.json();
    if (!data.ok) throw new Error(data.reason || 'failed');
    const DATA = COLL_CFG[kind].data(), GOT = COLL_CFG[kind].got();
    const norm = s => String(s).normalize('NFKC').replace(/[\s　]+/g, '');
    const idx = new Map();
    DATA.forEach((m, i) => idx.set(norm(m.n), i));
    const toCheck = [], unknown = [];
    for (const name of data.names) {
      const i = idx.get(norm(name));
      if (i === undefined) { unknown.push(name); continue; }
      if (!GOT[i]) toCheck.push(i);
    }
    if (unknown.length) console.warn(`[lodestone-sync] ${kind}: カタログに無い名前 ${unknown.length}件:`, unknown);
    if (!toCheck.length) {
      alert(`Lodestone: 所持${data.names.length}件を照合。新たにチェックする項目はありません${unknown.length ? `（名前不一致${unknown.length}件はF12コンソール参照）` : ''}`);
      reset('✓ 差分なし');
      return;
    }
    const preview = toCheck.slice(0, 15).map(i => '・' + DATA[i].n).join('\n');
    if (confirm(`Lodestoneの所持${data.names.length}件のうち、未チェック${toCheck.length}件に✓を入れます。\n（既存のチェックは外しません）\n\n${preview}${toCheck.length > 15 ? `\n…ほか${toCheck.length - 15}件` : ''}`)) {
      toCheck.forEach(i => { GOT[i] = true; });
      save();
      renderColl(kind);
      reset(`✓ ${toCheck.length}件反映`);
    } else {
      reset('↓ Lodestoneから反映');
    }
  } catch(e) {
    console.warn('[lodestone-sync]', e);
    reset(String(e.message).includes('private') ? '✕ Lodestone側が非公開設定' : '✕ 取得失敗');
  }
}

      save();
      renderClearProg();
    } else {
      setB('↓ アチーブ同期');
    }
  } catch (e) {
    console.warn('[cp-achievement-sync]', e);
    setB(String(e && e.message).includes('private') ? '✕ Lodestone側が非公開設定' : '✕ 取得失敗');

  }
}

let gxBoss = 'valig';
const gxEsc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const gxSec = t => { const p=String(t).split(':'); const v=parseInt(p[0],10)*60+(parseInt(p[1],10)||0); return isNaN(v)?1e9:v; };
function gxRows(bid){
  const base = GX_TL[bid].map((r,i)=>({key:'b'+i, t:r.t, m:r.m, w:r.w, custom:false}));
  let extra=[]; try{ extra=JSON.parse(S['gxrows_'+bid]||'[]'); }catch(e){}
  return base.concat(extra.map(r=>({key:r.id, t:r.t, m:r.m, w:0, custom:true}))).sort((a,b)=>gxSec(a.t)-gxSec(b.t));
}
function gxSetMit(bid,key,role,el){ S['gxm_'+bid+'_'+key+'_'+role]=el.value; save(); }
function gxAddRow(){
  const t=prompt('時間（例 3:15）'); if(t===null||!t.trim())return;
  const m=prompt('技名'); if(m===null||!m.trim())return;
  let rows=[]; try{ rows=JSON.parse(S['gxrows_'+gxBoss]||'[]'); }catch(e){}
  rows.push({id:'c'+Date.now().toString(36), t:t.trim(), m:m.trim()});
  S['gxrows_'+gxBoss]=JSON.stringify(rows); save(); renderGogoku();
}
function gxAddLink(){
  const l=prompt('タイトル（例: 〇〇氏の解説動画）'); if(l===null||!l.trim())return;
  const u=prompt('URL'); if(u===null||!u.trim())return;
  let links=[]; try{ links=JSON.parse(S['gxlinks_'+gxBoss]||'[]'); }catch(e){}
  links.push({id:'l'+Date.now().toString(36), l:l.trim(), u:u.trim()});
  S['gxlinks_'+gxBoss]=JSON.stringify(links); save(); renderGogoku();
}
function gxDelLink(id){
  if(!confirm('このリンクを削除する？'))return;
  let links=[]; try{ links=JSON.parse(S['gxlinks_'+gxBoss]||'[]'); }catch(e){}
  S['gxlinks_'+gxBoss]=JSON.stringify(links.filter(x=>x.id!==id)); save(); renderGogoku();
}
function gxDelRow(key){
  if(!confirm('この行を削除する？'))return;
  let rows=[]; try{ rows=JSON.parse(S['gxrows_'+gxBoss]||'[]'); }catch(e){}
  S['gxrows_'+gxBoss]=JSON.stringify(rows.filter(r=>r.id!==key));
  delete S['gxm_'+gxBoss+'_'+key+'_pld']; delete S['gxm_'+gxBoss+'_'+key+'_sch']; delete S['gxm_'+gxBoss+'_'+key+'_memo'];
  save(); renderGogoku();
}
function renderGogoku(){
  const role = S['gx_role']||'pld';
  const boss = GX_BOSSES.find(b=>b.id===gxBoss);
  const bossChips = GX_BOSSES.map(b=>`<button class="filter-btn${b.id===gxBoss?' active':''}"${b.id===gxBoss?` style="background:${b.c}"`:''} onclick="gxBoss='${b.id}';renderGogoku()">${b.n}</button>`).join('');
  const roleChips = [['pld','ナイト'],['sch','学者'],['both','両方']].map(([k,l])=>`<button class="filter-btn${role===k?' active':''}" onclick="S['gx_role']='${k}';save();renderGogoku()">${l}</button>`).join('');
  const showPld = role==='pld'||role==='both', showSch = role==='sch'||role==='both';
  const rows = gxRows(gxBoss).map(r=>{
    const cls = r.m.startsWith('（') ? 'gx-dim' : (r.w===2?'gx-w2':r.w===1?'gx-w1':'');
    const mit = rl => `<td><input class="gx-mit" value="${gxEsc(S['gxm_'+gxBoss+'_'+r.key+'_'+rl]??'')}" placeholder="—" onchange="gxSetMit('${gxBoss}','${r.key}','${rl}',this)"></td>`;
    const del = r.custom ? `<button class="gx-del" onclick="gxDelRow('${r.key}')" title="行を削除">✕</button>` : '';
    return `<tr><td class="gx-time">${gxEsc(r.t)}</td><td class="${cls}">${gxEsc(r.m)}${del}</td>${showPld?mit('pld'):''}${showSch?mit('sch'):''}${mit('memo')}</tr>`;
  }).join('');
  const notes = GX_NOTES[gxBoss] ? `<div class="gx-notes">${GX_NOTES[gxBoss]}</div>` : '';
  let links=[]; try{ links=JSON.parse(S['gxlinks_'+gxBoss]||'[]'); }catch(e){}
  const linkChips = links.map(x=>`<a class="gx-link" href="${gxEsc(x.u)}" target="_blank" rel="noopener">▶ ${gxEsc(x.l)}<button class="gx-del" onclick="event.preventDefault();gxDelLink('${x.id}')" title="削除">✕</button></a>`).join('');
  document.getElementById('tab-gogoku').innerHTML = `

}

// sort: 'role'=ロール別(default), 'status'=ステータス別
let weaponSort = 'role';

function renderWeapons() {
  const SC = {todo:'color:var(--red)',wip:'color:var(--gold)',done:'color:var(--green)',perfect:'color:#c084fc'};
  const SL = {todo:'未着手',wip:'仕掛中',done:'完了',perfect:'完璧'};
  // status sort order: wip first, then todo, then done, then perfect
  const SO = {wip:0, todo:1, done:2, perfect:3};

  const doneCount = WEAPONS.filter(w=>['done','perfect'].includes(S['ws_'+w.id]||w.status)).length;

  const sortBtns = `<div class="filter-row" style="margin-bottom:14px">
    <span style="font-family:var(--mono);font-size:11px;color:var(--text3);margin-right:4px">並び順:</span>
    <button class="filter-btn${weaponSort==='role'?' active':''}" onclick="weaponSort='role';renderWeapons()">ロール別</button>
    <button class="filter-btn${weaponSort==='status'?' active':''}" onclick="weaponSort='status';renderWeapons()">ステータス別</button>
  </div>`;

  let html = `<div class="sec-title">光る武器進捗<span class="sec-cnt"><b>${doneCount}</b>/${WEAPONS.length} 完了</span></div>
  ${sortBtns}`;

  function makeRow(w) {
    const status = S['ws_'+w.id] || w.status;
    const note   = S['wn_'+w.id]  !== undefined ? S['wn_'+w.id]  : w.note;
    const series = S['wsr_'+w.id] !== undefined ? S['wsr_'+w.id] : w.series;
    const isDone = S[w.id]||false;
    return `<tr class="${isDone?'done-row':''}">
      <td>
        <div style="display:flex;align-items:center;gap:7px;cursor:pointer" onclick="toggle('${w.id}')">
          <div class="chk" style="flex-shrink:0"><span class="chk-mark" style="${isDone?'display:block':''}">✓</span></div>
          ${w.job}
        </div>
      </td>
      <td>
        <input class="note-input" style="color:var(--text2);width:120px" value="${series.replace(/"/g,'&quot;')}"
          onblur="S['wsr_${w.id}']=this.value;save()"
          onkeydown="if(event.key==='Enter')this.blur()">
      </td>
      <td>
        <select class="status-sel" style="${SC[status]}"
          onchange="S['ws_${w.id}']=this.value;save();renderWeapons()">
          ${['todo','wip','done','perfect'].map(s=>`<option value="${s}"${status===s?' selected':''}>${SL[s]}</option>`).join('')}
        </select>
      </td>
      <td>
        <input class="note-input" value="${note.replace(/"/g,'&quot;')}"
          onblur="S['wn_${w.id}']=this.value;save()"
          onkeydown="if(event.key==='Enter')this.blur()">
      </td>
    </tr>`;
  }

  if (weaponSort === 'role') {
    const roleLabel = {tank:'TANK', healer:'HEALER', dps:'DPS'};
    ['tank','healer','dps'].forEach(role => {
      const group = WEAPONS.filter(w=>w.role===role);
      const doneCnt = group.filter(w=>['done','perfect'].includes(S['ws_'+w.id]||w.status)).length;
      html += `
        <div class="sec-title" style="margin-top:18px">${roleLabel[role]}
          <span class="sec-cnt"><b>${doneCnt}</b>/${group.length}</span>
        </div>
        <table class="weapon-tbl">
          <tr><th style="width:130px">ジョブ</th><th style="width:130px">シリーズ</th><th style="width:110px">ステータス</th><th>メモ</th></tr>
          ${group.map(makeRow).join('')}
        </table>`;
    });
  } else {
    // group by status: wip → todo → done → perfect
    const statusLabel = {wip:'仕掛中', todo:'未着手', done:'完了', perfect:'完璧'};
    const statusColor = {wip:'var(--gold)', todo:'var(--red)', done:'var(--green)', perfect:'#c084fc'};
    ['wip','todo','done','perfect'].forEach(st => {
      const group = WEAPONS.filter(w=>(S['ws_'+w.id]||w.status)===st);
      if (!group.length) return;
      html += `
        <div class="sec-title" style="margin-top:18px;color:${statusColor[st]}">${statusLabel[st]}
          <span class="sec-cnt" style="color:${statusColor[st]}">${group.length} 件</span>
        </div>
        <table class="weapon-tbl">
          <tr><th style="width:130px">ジョブ</th><th style="width:130px">シリーズ</th><th style="width:110px">ステータス</th><th>メモ</th></tr>
          ${group.map(makeRow).join('')}
        </table>`;
    });
  }

  document.getElementById('tab-weapons').innerHTML = html;
}

function glamDeletePiece(gid, pi) {
  const g = S.glamours.find(x=>x.id===gid);
  // remove check state for this piece and re-index subsequent pieces
  const oldKey = gid+'_p'+pi;
  delete S[oldKey];
  // shift down higher indices
  for (let i=pi+1; i<g.pieces.length; i++) {
    S[gid+'_p'+(i-1)] = S[gid+'_p'+i];
    delete S[gid+'_p'+i];
  }
  g.pieces.splice(pi,1);
  save(); closeModal(); renderGlamour(); renderGP();
}

function gjEsc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// WebPエンコード可否（iOS SafariはJPEGへフォールバック）
const GJ_FMT = (() => {
  try { return document.createElement('canvas').toDataURL('image/webp').indexOf('data:image/webp') === 0 ? 'image/webp' : 'image/jpeg'; }
  catch(e) { return 'image/jpeg'; }
})();

// クライアント側で縮小圧縮（目標 ≤110KB/枚 — localStorage 5MB と同期ペイロードを守る）
async function gjCompress(blob) {
  const bmp = await createImageBitmap(blob);
  const tries = [[1024, .8], [1024, .62], [860, .55], [720, .48]];
  let out = null;
  for (const [dim, q] of tries) {
    const scale = Math.min(1, dim / Math.max(bmp.width, bmp.height));
    const w = Math.max(1, Math.round(bmp.width * scale)), h = Math.max(1, Math.round(bmp.height * scale));
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(bmp, 0, 0, w, h);
    out = cv.toDataURL(GJ_FMT, q);
    if (out.length < 150000) break;
  }
  return out;
}

function gjPickImage(key) {
  const j = GLAM_JOBS.find(x => x.key === key);
  if (!j) return;
  gjPasteTarget = key;
  const cur = S.glamJobs[key];
  document.getElementById('modal-title').textContent = j.name + ' — スクショ';
  document.getElementById('modal-body').innerHTML = `
    <div id="gj-drop" style="border:2px dashed var(--border2);border-radius:8px;padding:26px 12px;text-align:center;color:var(--text2);font-size:12.5px;line-height:1.8;cursor:pointer;margin-bottom:10px">
      <b>ここをタップしてファイル選択</b><br>PCなら このまま <b>Ctrl+V</b> 貼り付け／ドラッグ&ドロップもOK<br><span style="color:var(--text3);font-size:11px">自動で縮小圧縮して保存（クラウド同期対応）</span>
    </div>
    <input type="file" id="gj-file" accept="image/*" style="display:none">
    <div id="gj-status" style="font-size:11.5px;color:var(--text3);min-height:16px;margin-bottom:4px"></div>
    ${cur && cur.img ? `<button onclick="gjDeleteImage('${key}')" style="background:#2a0d0d;border:1px solid var(--red2);color:var(--red);padding:5px 14px;border-radius:4px;cursor:pointer;font-family:var(--sans);font-size:12px">画像を削除</button>` : ''}`;
  document.getElementById('modal-save-btn').style.display = 'none';
  document.getElementById('modal-overlay').style.display = 'flex';
  const drop = document.getElementById('gj-drop'), file = document.getElementById('gj-file');
  drop.onclick = () => file.click();
  drop.ondragover = e => { e.preventDefault(); drop.style.borderColor = 'var(--accent)'; };
  drop.ondragleave = () => { drop.style.borderColor = 'var(--border2)'; };
  drop.ondrop = e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f && f.type.indexOf('image/') === 0) gjApply(key, f); };
  file.onchange = () => { if (file.files[0]) gjApply(key, file.files[0]); };
}

async function gjApply(key, blob) {
  const st = document.getElementById('gj-status');
  if (st) st.textContent = '圧縮中…';
  try {
    const img = await gjCompress(blob);
    if (!S.glamJobs[key]) S.glamJobs[key] = {};
    S.glamJobs[key].img = img;
    S.glamJobs[key].updated = new Date().toISOString().slice(0, 10);
    save(); closeModal(); renderGlamour();
  } catch(e) {
    if (st) st.textContent = '読み込み失敗: ' + e.message;
  }
}

// モーダルを開いた状態での Ctrl+V（クリップボード画像）
document.addEventListener('paste', e => {
  if (!gjPasteTarget) return;
  const items = (e.clipboardData || {}).items || [];
  for (const it of items) {
    if (it.type && it.type.indexOf('image/') === 0) {
      e.preventDefault();
      gjApply(gjPasteTarget, it.getAsFile());
      return;
    }
  }
});

function gjDeleteImage(key) {
  if (S.glamJobs[key]) { delete S.glamJobs[key].img; save(); }
  closeModal(); renderGlamour();
}

function gjEditMemo(key) {
  const j = GLAM_JOBS.find(x => x.key === key);
  if (!j) return;
  const cur = (S.glamJobs[key] && S.glamJobs[key].memo) || '';
  document.getElementById('modal-title').textContent = j.name + ' — メモ';
  document.getElementById('modal-body').innerHTML = `
    <textarea id="gj-memo-ta" style="width:100%;height:110px;background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-family:var(--sans);font-size:13px;padding:8px 10px;border-radius:4px;resize:vertical;box-sizing:border-box" placeholder="装備名・染色・入手先など">${gjEsc(cur)}</textarea>`;
  document.getElementById('modal-overlay').style.display = 'flex';
  document.getElementById('modal-save-btn').onclick = () => {
    if (!S.glamJobs[key]) S.glamJobs[key] = {};
    S.glamJobs[key].memo = document.getElementById('gj-memo-ta').value.trim();
    save(); closeModal(); renderGlamour();
  };
}

// タップで拡大（ライトボックス）
function gjShow(key) {
  const d = S.glamJobs[key];
  if (!d || !d.img) return;
  const j = GLAM_JOBS.find(x => x.key === key);
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:zoom-out;padding:16px;gap:10px';
  ov.innerHTML = `<img src="${d.img}" style="max-width:100%;max-height:88%;border:2px solid var(--ink);border-radius:8px;box-shadow:4px 4px 0 var(--ink)">
    <div style="color:var(--text2);font-size:12.5px;font-family:var(--sans)">${j ? gjEsc(j.name) : ''}${d.updated ? `<span style="color:var(--text3)">・${d.updated}</span>` : ''}</div>`;
  ov.onclick = () => ov.remove();

// ==================== GLAMOUR RENDER ====================
let glamFilter = 'all';
let glamView = 'set'; // 'set'=コーデ別 / 'piece'=部位別

function renderGlamour() {
  // --- ジョブ別ミラプリ（全ジョブ固定枠・スクショ＋メモ） ---
  const gjDone = GLAM_JOBS.filter(j => S.glamJobs[j.key] && S.glamJobs[j.key].img).length;
  const gjSection = `
    <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:4px;flex-wrap:wrap">
      <span style="font-weight:700;font-size:15px">ジョブ別ミラプリ</span>
      <span style="font-size:12px;color:var(--text2)">スクショ <b>${gjDone}</b>/${GLAM_JOBS.length}</span>
      <span style="font-size:10.5px;color:var(--text3)">画像は自動縮小・クラウド同期に載る（PC⇔スマホ）</span>
    </div>` +
    GJ_ROLES.map(([role, label]) => {
      const cards = GLAM_JOBS.filter(j => j.role === role).map(j => {
        const d = S.glamJobs[j.key] || {};
        const memo = d.memo || '';
        return `<div class="gj-card">
          <div class="gj-head">
            <img src="${iconUrl(j.icon)}" alt="" onerror="this.style.display='none'">
            <span class="gj-name">${j.name}</span>
            <button onclick="gjPickImage('${j.key}')" title="スクショを設定" style="background:none;border:none;cursor:pointer;font-size:13px;padding:0 3px;line-height:1">📷</button>
          </div>
          <div class="gj-img" onclick="${d.img ? `gjShow('${j.key}')` : `gjPickImage('${j.key}')`}">
            ${d.img ? `<img src="${d.img}" alt="${j.name}" loading="lazy">` : `<div class="gj-empty">＋ スクショを貼る</div>`}
          </div>
          <div class="gj-memo${memo ? '' : ' empty'}" onclick="gjEditMemo('${j.key}')">${memo ? gjEsc(memo) : 'メモを書く…'}</div>
        </div>`;
      }).join('');
      return `<div style="font-size:11px;font-weight:700;color:var(--text3);letter-spacing:1px;margin:12px 0 6px">${label}</div><div class="gj-grid">${cards}</div>`;
    }).join('');

  // --- コーデ（部位トラッカー・既存） ---
  const jobs = [...new Set(S.glamours.map(g=>g.job))];
  const filterRow = `<div class="filter-row" style="margin-bottom:10px">
    ${['all',...jobs].map(j=>`<button class="filter-btn${glamFilter===j?' active':''}" onclick="glamFilter='${j}';renderGlamour()">${j==='all'?'すべて':j}</button>`).join('')}
  </div>`;

  const addBtn = `<div style="margin-bottom:14px">
    <button class="filter-btn" onclick="glamAddSet()" style="color:var(--green);border-color:var(--green2);background:#0d2a1a">＋ コーデを追加</button>
  </div>`;

  const viewRow = `<div style="display:flex;gap:6px;margin-bottom:10px">
    <button class="filter-btn${glamView==='set'?' active':''}" onclick="glamView='set';renderGlamour()">コーデ別</button>
    <button class="filter-btn${glamView==='piece'?' active':''}" onclick="glamView='piece';renderGlamour()">部位別</button>
  </div>`;

  const shown = glamFilter === 'all' ? S.glamours : S.glamours.filter(g=>g.job===glamFilter);

  // --- 部位別ビュー: 全コーデの部位を SLOTS 軸でピボット ---
  if (glamView === 'piece') {
    const extraSlots = [...new Set(shown.flatMap(g=>g.pieces.map(p=>p.slot)))].filter(s=>!SLOTS.includes(s));
    const slotCards = [...SLOTS, ...extraSlots].map(slot => {
      const rows = [];
      shown.forEach(g => g.pieces.forEach((p, i) => { if (p.slot === slot) rows.push({ g, p, i }); }));
      if (!rows.length) return '';
      const done = rows.filter(r => S[r.g.id+'_p'+r.i]).length;
      const items = rows.map(({ g, p, i }) => `
        <div class="glam-piece${S[g.id+'_p'+i]?' done':''}">
          <div class="gp-chk" onclick="toggle('${g.id}_p${i}')" style="cursor:pointer"><span class="gp-chk-mark">✓</span></div>
          <span class="gp-slot" style="cursor:pointer" onclick="toggle('${g.id}_p${i}')" title="コーデ">${g.job}</span>
          <div style="flex:1;cursor:pointer" onclick="toggle('${g.id}_p${i}')">
            <div class="gp-name">${p.name}</div>
            ${p.color!=='デフォルト'||p.source?`<div class="gp-src">${[p.color!=='デフォルト'?p.color:'',p.source||''].filter(Boolean).join(' / ')}</div>`:''}
          </div>
          <button onclick="glamEditPiece('${g.id}',${i})" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;padding:0 4px" title="部位を編集">✎</button>
        </div>`).join('');
      return `<div class="glam-card">
        <div class="glam-header">
          <span class="glam-job">${slot}</span>
          <span class="glam-cnt"><b>${done}</b>/${rows.length}</span>
        </div>
        <div>${items}</div>
      </div>`;
    }).filter(Boolean).join('');

    document.getElementById('tab-glamour').innerHTML = gjSection +
      `<div style="font-weight:700;font-size:15px;margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--border)">コーデ（部位トラッカー）</div>` +
      viewRow + filterRow +
      (slotCards ? `<div class="glamour-section">${slotCards}</div>` : '<div class="empty">部位が登録されていない</div>');
    return;
  }

  const cards = shown.map(g=>{
    const dp = g.pieces.filter((_,i)=>S[g.id+'_p'+i]).length;
    const pieces = g.pieces.map((p,i)=>`
      <div class="glam-piece${S[g.id+'_p'+i]?' done':''}">
        <div class="gp-chk" onclick="toggle('${g.id}_p${i}')" style="cursor:pointer"><span class="gp-chk-mark">✓</span></div>
        <span class="gp-slot" style="cursor:pointer" onclick="toggle('${g.id}_p${i}')">${p.slot}</span>
        <div style="flex:1;cursor:pointer" onclick="toggle('${g.id}_p${i}')">
          <div class="gp-name">${p.name}</div>
          ${p.color!=='デフォルト'||p.source?`<div class="gp-src">${[p.color!=='デフォルト'?p.color:'',p.source||''].filter(Boolean).join(' / ')}</div>`:''}
        </div>
        <button onclick="glamEditPiece('${g.id}',${i})" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;padding:0 4px" title="部位を編集">✎</button>
      </div>`).join('');

    return `<div class="glam-card">
      <div class="glam-header">
        <span class="glam-job">${g.job}</span>
        <span class="glam-cnt"><b>${dp}</b>/${g.pieces.length}</span>
        <button onclick="glamAddPiece('${g.id}')" style="background:none;border:none;color:var(--green);cursor:pointer;font-size:18px;line-height:1;padding:0 4px" title="部位を追加">＋</button>
        <button onclick="glamEditSet('${g.id}')" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;padding:0 4px" title="コーデを編集">✎</button>
        ${g.url?`<a class="glam-url" href="${g.url}" target="_blank" onclick="event.stopPropagation()">↗ 参照</a>`:''}
      </div>
      <div>${pieces}</div>
    </div>`;
  }).join('');

  document.getElementById('tab-glamour').innerHTML = gjSection +
    `<div style="font-weight:700;font-size:15px;margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--border)">コーデ（部位トラッカー）</div>` +
    viewRow + filterRow + addBtn +
    `<div class="glamour-section">${cards}</div>`;
}

let siteFilter = 'all';

function renderSites() {
  const cats = [...new Set(SITES.map(s=>s.cat))];
  const tagClass = {wiki:'st-wiki',tool:'st-tool',market:'st-market',glam:'st-glam',craft:'st-craft',hunt:'st-hunt',blue:'st-blue',end:'st-end'};
  const tagLabel = {wiki:'WIKI',tool:'TOOL',market:'MARKET',glam:'GLAM',craft:'CRAFT',hunt:'HUNT',blue:'BLUE MAGE',end:'HIGH-END'};

  const filters = `<div class="filter-row" style="margin-bottom:18px">
    ${['all',...cats].map(c=>`<button class="filter-btn${siteFilter===c?' active':''}" onclick="siteFilter='${c}';renderSites()">${c==='all'?'すべて':c}</button>`).join('')}
  </div>`;

  const shown = siteFilter==='all' ? SITES : SITES.filter(s=>s.cat===siteFilter);

  // group by cat when showing all
  let cardsHtml = '';
  if (siteFilter === 'all') {
    cats.forEach(cat => {
      const group = shown.filter(s=>s.cat===cat);
      cardsHtml += `<div class="sec-title" style="margin-top:20px">${cat}</div>
        <div class="sites-grid" style="margin-bottom:8px">
          ${group.map(s=>siteCard(s,tagClass,tagLabel)).join('')}
        </div>`;
    });
  } else {
    cardsHtml = `<div class="sites-grid">${shown.map(s=>siteCard(s,tagClass,tagLabel)).join('')}</div>`;
  }

  document.getElementById('tab-sites').innerHTML = filters + cardsHtml;
}

function siteCard(s, tagClass, tagLabel) {
  // Use Google favicon service for thumbnails (works from any browser)
  const favicon = `https://www.google.com/s2/favicons?sz=64&domain_url=${encodeURIComponent(s.url)}`;
  return `<a class="site-card" href="${s.url}" target="_blank" rel="noopener">
    <div class="site-thumb-fb" style="position:relative">
      <span style="font-size:36px">${s.emoji}</span>
      <img src="${favicon}" alt="" style="position:absolute;bottom:6px;right:8px;width:20px;height:20px;border-radius:4px;background:var(--bg2)" onerror="this.style.display='none'">
    </div>
    <div class="site-body">
      <div class="site-name">${s.name}</div>
      <div class="site-url">${s.url.replace('https://','').replace('http://','')}</div>
      <div class="site-desc">${s.desc}</div>
      <span class="site-tag ${tagClass[s.tag]}">${tagLabel[s.tag]}</span>
    </div>
  </a>`;
}

// ランク累計クエスト数閾値
const RANK_THRESHOLDS = { '中立':0, '友好':18, '信頼':36, '献身':54, '名誉':72, '誓約':90, '誓約★':108 };
function calcRank(total) {
  const entries = Object.entries(RANK_THRESHOLDS).reverse();
  for (const [rank, th] of entries) { if (total >= th) return rank; }
  return '中立';
}

// state init: beastRanks → beastProgress 移行
if (!S.beastProgress) {
  S.beastProgress = {};
  const BEAST_INIT = {
    b_amr:'信頼', b_syl:'信頼', b_kob:'信頼', b_sah:'信頼',
    b_ikx:'誓約', b_vnu:'誓約',
    b_gna:'誓約★', b_mog:'誓約',
    b_koj:'誓約', b_ana:'誓約★', b_nmz:'誓約★',
    b_dwa:'誓約', b_pix:'誓約', b_kit:'誓約',
    b_ark:'誓約', b_omc:'誓約', b_rep:'誓約',
    b_ppr:'献身', b_mam:'未解放', b_yok:'未解放',
  };
  BEASTS_DEFAULT.forEach(b => {
    const rank = (S.beastRanks && S.beastRanks[b.id]) || BEAST_INIT[b.id] || '未解放';
    const totalCount = rank === '未解放' ? 0 : (RANK_THRESHOLDS[rank] || 0);
    S.beastProgress[b.id] = { rank, todayCount:0, totalCount, lastDate:'' };
  });
}

function beastToday() { return new Date().toISOString().slice(0,10); }

function beastAdd(id, delta) {
  const p = S.beastProgress[id];
  const today = beastToday();
  if (delta > 0 && p.lastDate !== today) { p.todayCount = 0; p.lastDate = today; }
  if (delta > 0) {
    const b = BEASTS_DEFAULT.find(x=>x.id===id);
    const dailyMax = b.dailyMax || 3;
    if (p.todayCount >= dailyMax) return; // 本日済
    p.todayCount += delta;
  }
  p.totalCount = Math.max(0, p.totalCount + delta);
  p.rank = p.totalCount === 0 ? '未解放' : calcRank(p.totalCount);
  save(); renderBeast();
}

// ランク → 進捗数値（0-6）
function rankIdx(r) { return RANKS.indexOf(r); }

function renderBeast() {
  const exps = [...new Set(BEASTS_DEFAULT.map(b=>b.exp))];
  const typeLabel = { battle:'⚔️ 戦闘', craft:'🔨 クラフター', gather:'🌿 ギャザラー' };
  const typeFilter = ['all','battle','craft','gather'];

  if (renderBeast._filter === undefined) renderBeast._filter = 'all';
  const f = renderBeast._filter;
  const today = beastToday();

  const filterRow = `<div class="filter-row" style="margin-bottom:16px">
    ${typeFilter.map(t=>`<button class="filter-btn${f===t?' active':''}" onclick="renderBeast._filter='${t}';renderBeast()">${t==='all'?'すべて':typeLabel[t]}</button>`).join('')}
  </div>`;

  const total = BEASTS_DEFAULT.length;
  const allied = BEASTS_DEFAULT.filter(b=>S.beastProgress[b.id]?.rank==='誓約'||S.beastProgress[b.id]?.rank==='誓約★').length;
  const started = BEASTS_DEFAULT.filter(b=>S.beastProgress[b.id]?.rank!=='未解放').length;

  const header = `<div class="sec-title" style="margin-bottom:16px">
    蛮族クエスト進捗
    <span class="sec-cnt">誓約 <b>${allied}</b>/${total} &nbsp;|&nbsp; 開始済み <b>${started}</b>/${total}</span>
  </div>`;

  const sections = exps.map(exp => {
    const group = BEASTS_DEFAULT.filter(b => b.exp===exp && (f==='all' || b.type===f));
    if (!group.length) return '';

    const cards = group.map(b => {
      const p = S.beastProgress[b.id] || { rank:'未解放', todayCount:0, totalCount:0, lastDate:'' };
      const rank = p.rank;
      const color = RANK_COLOR[rank] || 'var(--text3)';
      const dailyMax = b.dailyMax || 3;
      const todayDone = p.lastDate === today && p.todayCount >= dailyMax;

      // ランク内進捗バー
      const nextRankEntry = Object.entries(RANK_THRESHOLDS).find(([,th])=>th>p.totalCount);
      const nextTh = nextRankEntry ? nextRankEntry[1] : 108;
      const curTh = rank==='未解放' ? 0 : (RANK_THRESHOLDS[rank]||0);
      const inRankTotal = nextTh - curTh;
      const inRankDone = p.totalCount - curTh;
      const pct = rank==='誓約★' ? 100 : Math.round(inRankDone/inRankTotal*100);

      const todayCount = p.lastDate === today ? p.todayCount : 0;

      return `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;transition:border-color .12s"
        onmouseenter="this.style.borderColor='var(--border2)'" onmouseleave="this.style.borderColor='var(--border)'">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:20px">${b.emoji}</span>
          <div style="flex:1">
            <div style="font-size:13px;font-weight:500">${b.name}</div>
            <div style="font-size:11px;color:var(--text3);font-family:var(--mono)">${typeLabel[b.type]} &nbsp;·&nbsp; ${b.patch}</div>
          </div>
          <span style="font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:3px;border:1px solid;color:${color};border-color:${color}55;background:${color}11">${rank}</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="flex:1">
            <div style="height:4px;background:var(--bg4);border-radius:2px;overflow:hidden;margin-bottom:4px">
              <div style="height:100%;width:${pct}%;background:${color};border-radius:2px;transition:width .3s"></div>
            </div>
            <div style="font-size:10px;color:var(--text3);font-family:var(--mono)">${rank==='誓約★'?'MAX':inRankDone+'/'+inRankTotal} &nbsp;·&nbsp; 今日: ${todayCount}/${dailyMax}</div>
          </div>
          <button onclick="beastAdd('${b.id}',${dailyMax})" ${todayDone?'disabled':''} style="font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:3px;border:1px solid var(--accent2);background:${todayDone?'var(--bg4)':'#0d1d35'};color:${todayDone?'var(--text3)':'var(--accent)'};cursor:${todayDone?'default':'pointer'}">${todayDone?'本日済':'+1日分'}</button>
          <button onclick="beastAdd('${b.id}',-1)" style="font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:3px;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer">−</button>
        </div>
        <div style="font-size:11px;color:var(--text3)">報酬: ${b.reward}</div>
      </div>`;
    }).join('');

    const expAllied = group.filter(b=>S.beastProgress[b.id]?.rank==='誓約'||S.beastProgress[b.id]?.rank==='誓約★').length;
    return `<div class="sec-title" style="margin-top:20px">${exp}
      <span class="sec-cnt">誓約 <b>${expAllied}</b>/${group.length}</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-bottom:4px">
      ${cards}
    </div>`;
  }).join('');

  document.getElementById('tab-beast').innerHTML = header + filterRow + sections;
}

let blueFilter = 'all'; // all/unlearned/attack/heal/support/special
let blueSearch = '';

function renderBlueMage() {
  const catLabel = {attack:'⚔️ 攻撃', heal:'💚 回復', support:'🛡️ サポート'};
  const learned = BLUE_SPELLS.filter(s => S.blueLearned[s.no]).length;

  const filterRow = `<div class="filter-row" style="margin-bottom:8px">
    ${['all','unlearned','attack','heal','support'].map(f=>`
      <button class="filter-btn${blueFilter===f?' active':''}" onclick="blueFilter='${f}';renderBlueMage()">
        ${f==='all'?'すべて':f==='unlearned'?'未習得':catLabel[f]}
      </button>`).join('')}
  </div>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
    <input class="search-bar" style="max-width:280px;margin-bottom:0" placeholder="魔法名 / 入手先で検索…"
      value="${blueSearch}" oninput="blueSearch=this.value;renderBlueMage()">
    <span style="font-family:var(--mono);font-size:12px;color:var(--text3)">習得 <b style="color:var(--green)">${learned}</b>/124</span>
    <button class="filter-btn" onclick="if(confirm('全チェックをリセットしますか？')){S.blueLearned={};save();renderBlueMage()}" style="color:var(--red);border-color:var(--red2);margin-left:auto">リセット</button>
  </div>`;

  const shown = BLUE_SPELLS.filter(s => {
    if (blueFilter === 'unlearned' && S.blueLearned[s.no]) return false;
    if (['attack','heal','support'].includes(blueFilter) && s.cat !== blueFilter) return false;
    if (blueSearch) {
      const q = blueSearch.toLowerCase();
      return s.name.includes(q) || s.src.toLowerCase().includes(q);
    }
    return true;
  });

  // group by patch
  const patches = [
    {label:'Patch 4.5（No.1-49）',   from:1,   to:49},
    {label:'Patch 5.15（No.50-80）',  from:50,  to:80},
    {label:'Patch 5.45（No.81-104）', from:81,  to:104},
    {label:'Patch 6.45（No.105-124）',from:105, to:124},
  ];

  const sections = patches.map(p => {
    const group = shown.filter(s => s.no >= p.from && s.no <= p.to);
    if (!group.length) return '';
    const pLearned = BLUE_SPELLS.filter(s=>s.no>=p.from&&s.no<=p.to&&S.blueLearned[s.no]).length;
    const pTotal   = BLUE_SPELLS.filter(s=>s.no>=p.from&&s.no<=p.to).length;
    const rows = group.map(s => `
      <div class="todo-item${S.blueLearned[s.no]?' done':''}" onclick="S.blueLearned[${s.no}]=!S.blueLearned[${s.no}];save();renderBlueMage()">
        <div class="chk"><span class="chk-mark">✓</span></div>
        <div style="flex:1">
          <div class="ti-name"><span style="font-family:var(--mono);color:var(--text3);font-size:11px;margin-right:6px">${String(s.no).padStart(3,'0')}</span>${s.name}</div>
          <div class="ti-sub">${s.src}</div>
        </div>
        <span class="badge b-${s.cat==='attack'?'high':s.cat==='heal'?'once':'ongoing'}">${s.cat==='attack'?'攻撃':s.cat==='heal'?'回復':'サポート'}</span>
      </div>`).join('');
    return `<div class="sec-title">${p.label}<span class="sec-cnt"><b>${pLearned}</b>/${pTotal}</span></div>
            <div class="todo-grid">${rows}</div>`;
  }).join('');

  document.getElementById('tab-bluemage').innerHTML = filterRow + (sections || '<div class="empty">条件に一致する青魔法なし</div>');
}

const COLL_ICON_BASE = 'https://lds-img.finalfantasyxiv.com/itemicon/';
if (!S.minionGot) S.minionGot = {};
if (!S.mountGot)  S.mountGot  = {};
const COLL_CFG = {
  minion: { data: () => MINIONS, got: () => S.minionGot, tab: 'tab-minion' },
  mount:  { data: () => MOUNTS,  got: () => S.mountGot,  tab: 'tab-mount'  },
};
const collFilter = {
  minion: { cat: 'all', q: '', hide: false },
  mount:  { cat: 'all', q: '', hide: false },
};

function toggleColl(kind, i) {
  const got = COLL_CFG[kind].got();
  got[i] = !got[i];
  save();
  renderColl(kind);
}

function renderColl(kind) {
  const cfg = COLL_CFG[kind];
  const DATA = cfg.data();
  const GOT = cfg.got();
  const F = collFilter[kind];
  const cats = [...new Set(DATA.map(m => m.c))];
  const got = DATA.filter((m, i) => GOT[i]).length;
  const catOpts = ['all', ...cats].map(c =>
    `<option value="${c}"${F.cat === c ? ' selected' : ''}>${c === 'all' ? 'すべてのカテゴリ' : c}</option>`
  ).join('');

  const filterRow = `<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
    <select class="tier-sel" style="max-width:220px" onchange="collFilter['${kind}'].cat=this.value;renderColl('${kind}')">${catOpts}</select>
    <input class="search-bar" style="max-width:240px;margin-bottom:0" placeholder="名前 / 入手先で検索…"
      value="${F.q}" oninput="collFilter['${kind}'].q=this.value;renderColl('${kind}')">
    <label class="show-done-toggle"><input type="checkbox" ${F.hide ? 'checked' : ''} onchange="collFilter['${kind}'].hide=this.checked;renderColl('${kind}')"> 取得済みを隠す</label>
    <span style="font-family:var(--mono);font-size:12px;color:var(--text3)">取得 <b style="color:var(--green)">${got}</b>/${DATA.length}</span>
    ${(kind==='mount'||kind==='minion') ? `<button id="coll-lode-${kind}" class="filter-btn" style="font-size:11px" onclick="collLodestoneSync('${kind}')">↓ Lodestoneから反映</button>` : ''}
    <button class="filter-btn" onclick="if(confirm('全チェックをリセットしますか？')){COLL_CFG['${kind}'].got()&&Object.keys(COLL_CFG['${kind}'].got()).forEach(k=>delete COLL_CFG['${kind}'].got()[k]);save();renderColl('${kind}')}" style="color:var(--red);border-color:var(--red2)">リセット</button>
  </div>`;

  const shown = DATA.map((m, i) => ({ ...m, i })).filter(m => {
    if (F.cat !== 'all' && m.c !== F.cat) return false;
    if (F.hide && GOT[m.i]) return false;
    if (F.q) {
      const q = F.q.toLowerCase();
      return m.n.toLowerCase().includes(q) || (m.s || '').toLowerCase().includes(q);
    }
    return true;
  });

  const shownCats = [...new Set(shown.map(m => m.c))];
  const sections = shownCats.map(cat => {
    const group = shown.filter(m => m.c === cat);
    const gGot = group.filter(m => GOT[m.i]).length;
    const rows = group.map(m => `
      <div class="todo-item${GOT[m.i] ? ' done' : ''}" onclick="toggleColl('${kind}',${m.i})">
        <div class="chk"><span class="chk-mark">✓</span></div>
        <img src="${COLL_ICON_BASE + m.ic}" width="30" height="30" loading="lazy"
          style="border-radius:5px;flex-shrink:0;background:var(--bg3)" onerror="this.style.visibility='hidden'">
        <div style="flex:1;min-width:0">
          <div class="ti-name">${m.n}</div>
          ${m.s ? `<div class="ti-sub">${m.s}</div>` : ''}
        </div>
        <span class="badge ${m.mb ? 'b-ongoing' : 'b-high'}" title="マーケットボード">${m.mb ? '取引可' : '取引不可'}</span>
      </div>`).join('');
    return `<div class="sec-title">${cat}<span class="sec-cnt"><b>${gGot}</b>/${group.length}</span></div>
            <div class="todo-grid">${rows}</div>`;
  }).join('');

  document.getElementById(cfg.tab).innerHTML = filterRow + (sections || '<div class="empty">条件に一致する項目なし</div>');
}

function renderSeals() {
  const currencies = [...new Set(SEAL_ITEMS.map(i=>i.currency))];
  const types = [...new Set(SEAL_ITEMS.map(i=>i.type))];
  const typeColor = {マウント:'var(--gold)',ミニオン:'#c882e8',素材:'var(--accent)',その他:'var(--text2)'};

  const got = SEAL_ITEMS.filter(i=>S.sealGot[i.id]).length;

  const filters = `<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:flex-start">
    <div>
      <div style="font-family:var(--mono);font-size:10px;color:var(--text3);margin-bottom:4px">記章種</div>
      <div class="filter-row" style="margin-bottom:0">

      </div>
    </div>
    <div>
      <div style="font-family:var(--mono);font-size:10px;color:var(--text3);margin-bottom:4px">種別</div>
      <div class="filter-row" style="margin-bottom:0">

    </div>
    <span style="font-family:var(--mono);font-size:12px;color:var(--text3);align-self:flex-end;margin-left:auto">入手済み <b style="color:var(--green)">${got}</b>/${SEAL_ITEMS.length}</span>
  </div>`;

  const shown = SEAL_ITEMS.filter(i =>
    (sealCurrFilter==='all' || i.currency===sealCurrFilter) &&
    (sealTypeFilter==='all' || i.type===sealTypeFilter)
  );

  const sections = currencies.filter(c=>sealCurrFilter==='all'||c===sealCurrFilter).map(curr => {
    const group = shown.filter(i=>i.currency===curr);
    if (!group.length) return '';
    const currGot = SEAL_ITEMS.filter(i=>i.currency===curr&&S.sealGot[i.id]).length;
    const currTotal = SEAL_ITEMS.filter(i=>i.currency===curr).length;
    const rows = group.map(i => `
      <div class="todo-item${S.sealGot[i.id]?' done':''}" onclick="S.sealGot['${i.id}']=!S.sealGot['${i.id}'];save();renderSeals()">

          <div class="ti-sub">${i.currency}記章 × ${i.cost.toLocaleString()}</div>
        </div>
        <span class="badge" style="background:${typeColor[i.type]}22;color:${typeColor[i.type]};border:1px solid ${typeColor[i.type]}55">${i.type}</span>
      </div>`).join('');
    return `<div class="sec-title">${curr}記章<span class="sec-cnt"><b>${currGot}</b>/${currTotal}</span></div>
            <div class="todo-grid">${rows}</div>`;
  }).join('');

  document.getElementById('tab-seals').innerHTML = filters + (sections || '<div class="empty">条件に一致するアイテムなし</div>');
}

let orchExpFilter = 'all';
let orchSearch = '';
let orchShowGot = false;

function renderOrchstrion() {
  const exps = [...new Set(ORCH_ROLLS.map(r=>r.exp))];
  const got = ORCH_ROLLS.filter(r=>S.orchGot[r.id]).length;

  const filterRow = `<div class="filter-row" style="margin-bottom:8px">
    ${['all',...exps].map(e=>`<button class="filter-btn${orchExpFilter===e?' active':''}" onclick="orchExpFilter='${e}';renderOrchstrion()">${e==='all'?'すべて':e}</button>`).join('')}
  </div>
  <div style="display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap">
    <input class="search-bar" style="max-width:300px;margin-bottom:0" placeholder="曲名 / 入手先で検索…"
      value="${orchSearch}" oninput="orchSearch=this.value;renderOrchstrion()">
    <span style="font-family:var(--mono);font-size:12px;color:var(--text3)">入手済み <b style="color:var(--green)">${got}</b>/${ORCH_ROLLS.length}</span>
    <label class="show-done-toggle">
      <input type="checkbox" ${orchShowGot?'checked':''} onchange="orchShowGot=this.checked;renderOrchstrion()"> 取得済みを表示
    </label>
  </div>`;

  const shown = ORCH_ROLLS.filter(r => {
    if (!orchShowGot && S.orchGot[r.id]) return false;
    if (orchExpFilter !== 'all' && r.exp !== orchExpFilter) return false;
    if (orchSearch) {
      const q = orchSearch.toLowerCase();
      return r.name.toLowerCase().includes(q) || r.src.includes(q);
    }
    return true;
  });

  const sections = exps.filter(e=>orchExpFilter==='all'||e===orchExpFilter).map(exp => {
    const group = shown.filter(r=>r.exp===exp);
    if (!group.length) return '';
    const expGot   = ORCH_ROLLS.filter(r=>r.exp===exp&&S.orchGot[r.id]).length;
    const expTotal = ORCH_ROLLS.filter(r=>r.exp===exp).length;
    const rows = group.map(r => `
      <div class="todo-item${S.orchGot[r.id]?' done':''}" onclick="S.orchGot['${r.id}']=!S.orchGot['${r.id}'];save();renderOrchstrion()">
        <div class="chk"><span class="chk-mark">✓</span></div>
        <div style="flex:1">
          <div class="ti-name">🎵 ${r.name}</div>
          <div class="ti-sub">${r.src}</div>
        </div>
      </div>`).join('');
    return `<div class="sec-title">${exp}<span class="sec-cnt"><b>${expGot}</b>/${expTotal}</span></div>
            <div class="todo-grid">${rows}</div>`;
  }).join('');

  document.getElementById('tab-orchestrion').innerHTML = filterRow + (sections || '<div class="empty">条件に一致する譜面なし</div>');
}

if (!S.triadGot) S.triadGot = {};
let triadStarFilter = 'all';
let triadSearch = '';
let triadShowGot = true;

function ttVal(v) { return v === 10 ? 'A' : v; }

function renderTriad() {
  const got = TT_CARDS.filter(c => S.triadGot[c.id]).length;
  const stars = [1,2,3,4,5];

  const filterRow = `<div class="filter-row" style="margin-bottom:8px">
    ${['all',...stars].map(s => `<button class="filter-btn${triadStarFilter===s?' active':''}" onclick="triadStarFilter=${s==='all'?"'all'":s};renderTriad()">${s==='all'?'すべて':'★'+s}</button>`).join('')}
  </div>
  <div style="display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap">
    <input class="search-bar" style="max-width:300px;margin-bottom:0" placeholder="カード名 / 入手先で検索…"
      value="${triadSearch}" oninput="triadSearch=this.value;renderTriad()">
    <span style="font-family:var(--mono);font-size:12px;color:var(--text3)">取得済み <b style="color:var(--green)">${got}</b>/${TT_CARDS.length}</span>
    <label class="show-done-toggle">
      <input type="checkbox" ${triadShowGot?'checked':''} onchange="triadShowGot=this.checked;renderTriad()"> 取得済みを表示
    </label>
  </div>`;

  const q = triadSearch.toLowerCase();
  const shown = TT_CARDS.filter(c => {
    if (!triadShowGot && S.triadGot[c.id]) return false;
    if (triadStarFilter !== 'all' && c.r !== triadStarFilter) return false;
    if (q) return c.name.toLowerCase().includes(q) || c.src.toLowerCase().includes(q) || String(c.no) === q;
    return true;
  });

  const sections = stars.filter(s => triadStarFilter==='all' || s===triadStarFilter).map(star => {
    const group = shown.filter(c => c.r === star);
    if (!group.length) return '';
    const sGot   = TT_CARDS.filter(c => c.r===star && S.triadGot[c.id]).length;
    const sTotal = TT_CARDS.filter(c => c.r===star).length;
    const rows = group.map(c => `
      <div class="todo-item${S.triadGot[c.id]?' done':''}" onclick="S.triadGot['${c.id}']=!S.triadGot['${c.id}'];save();renderTriad()">
        <div class="chk"><span class="chk-mark">✓</span></div>
        <div style="flex:1">
          <div class="ti-name">🃏 <span style="font-family:var(--mono);font-size:11px;color:var(--text3)">No.${String(c.no).padStart(3,'0')}</span> ${c.name}
            <span style="font-family:var(--mono);font-size:10.5px;color:var(--text3);margin-left:4px" title="上・下・左・右">[${c.v.map(ttVal).join('・')}]</span></div>
          <div class="ti-sub">${'★'.repeat(c.r)} ${c.src}</div>
        </div>
      </div>`).join('');
    return `<div class="sec-title">★${star}<span class="sec-cnt"><b>${sGot}</b>/${sTotal}</span></div>
            <div class="todo-grid">${rows}</div>`;
  }).join('');

  document.getElementById('tab-triad').innerHTML = filterRow + (sections || '<div class="empty">条件に一致するカードなし</div>');
}

const CAB_FLAT = CABINET.flatMap(c => c.subs.flatMap(s => s.items.map(it => ({ i: it.i, n: it.n, x: it.x || 0, sl: it.sl || '', cat: c.cat, sub: s.sub }))));
if (!S.cabinetGot) S.cabinetGot = {};
let cabCat = null;
let cabSearch = '';
let cabShowGot = true;
const CAB_COLS = ['武器','副手','頭','胴','手','脚','足','耳','首','腕','指','魂'];

function cabTog(id){ S.cabinetGot[id] = !S.cabinetGot[id]; save(); renderCabinet(); }
function cabEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function cabLCP(a,b){ const n=Math.min(a.length,b.length); let i=0; while(i<n && a[i]===b[i]) i++; return i; }

function cabCell(it){
  const got = !!S.cabinetGot[it.i];
  const w = it.x===1 ? '<i class="cab-w">CN</i>' : (it.x===2 ? '<i class="cab-w">?</i>' : '');
  return `<td class="cab-c${got?' done':''}" title="${cabEsc(it.n||('ID:'+it.i))}" onclick="cabTog(${it.i})"><span class="cab-b">✓</span>${w}</td>`;
}

// サブカテゴリの items(Order順) を「シリーズ=行」に分割
function cabSeriesRows(items){
  const rows=[]; let cur=null;
  for(const it of items){
    const slot = it.sl || '';
    if(!slot){ rows.push({label:(it.n||('ID:'+it.i)), cells:{}, noslot:[it]}); cur=null; continue; }
    const fits = cur && cur.noslot.length===0 && !cur.cells[slot] && cabLCP(cur.rep, it.n)>=2;
    if(!fits){ cur={rep:it.n, cells:{}, noslot:[], label:''}; rows.push(cur); }
    cur.cells[slot]=it;
  }
  for(const r of rows){
    if(r.noslot.length) continue;
    const names = CAB_COLS.map(c=>r.cells[c]).filter(Boolean).map(x=>x.n).filter(Boolean);
    if(!names.length){ r.label='(名称データ未提供)'; continue; }
    let lab=names[0];
    for(let k=1;k<names.length;k++) lab=lab.slice(0, cabLCP(lab,names[k]));
    lab=lab.replace(/[・\s（(【\[]+$/,'').trim();
    if(lab.length<2) lab=names[0];
    r.label=lab;
  }
  return rows;
}

function renderCabinet(){
  if (cabCat === null) cabCat = CABINET[0].cat;
  const totalGot = CAB_FLAT.filter(it => S.cabinetGot[it.i]).length;

  const catBtns = CABINET.map(c => {
    const items = c.subs.flatMap(s => s.items);
    const g = items.filter(it => S.cabinetGot[it.i]).length;
    const active = (!cabSearch && cabCat === c.cat) ? ' active' : '';
    return `<button class="filter-btn${active}" onclick="cabSearch='';cabCat=${JSON.stringify(c.cat)};renderCabinet()">${c.cat} <b style="color:var(--green)">${g}</b>/${items.length}</button>`;
  }).join('');

  const style = `<style>

    .cab-w{font-style:normal;font-family:var(--mono);font-size:8px;color:#e0b341;vertical-align:top;margin-left:-4px}
  </style>`;

  const filterRow = `<div class="filter-row" style="margin-bottom:8px;flex-wrap:wrap">${catBtns}</div>
  <div style="display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap">
    <input class="search-bar" style="max-width:300px;margin-bottom:0" placeholder="装備名 / ID で全カテゴリ検索…"
      value="${cabSearch.replace(/"/g,'&quot;')}" oninput="cabSearch=this.value;renderCabinet()">
    <span style="font-family:var(--mono);font-size:12px;color:var(--text3)">取得済み <b style="color:var(--green)">${totalGot}</b>/${CAB_FLAT.length}</span>
    <label class="show-done-toggle">
      <input type="checkbox" ${cabShowGot?'checked':''} onchange="cabShowGot=this.checked;renderCabinet()"> 完了シリーズも表示
    </label>
  </div>`;

  const q = cabSearch.trim().toLowerCase();
  let bodyHtml;

  if (q) {
    // 検索＝全カテゴリ横断のフラット一覧
    const hits = CAB_FLAT.filter(it => (!cabShowGot && S.cabinetGot[it.i]) ? false : ((it.n && it.n.toLowerCase().includes(q)) || String(it.i)===q));
    const rows = hits.slice(0, 600).map(it => `
      <div class="todo-item${S.cabinetGot[it.i]?' done':''}" onclick="cabTog(${it.i})">
        <div class="chk"><span class="chk-mark">✓</span></div>
        <div style="flex:1"><div class="ti-name">🗄️ ${cabEsc(it.n||('ID:'+it.i))}${it.x===1?' <span style="font-size:10px;color:#e0b341">⚠CN</span>':''}</div>
        <div class="ti-sub">${it.cat} ／ ${it.sub}${it.sl?' ／ '+it.sl:''}</div></div>
      </div>`).join('');
    bodyHtml = `<div class="todo-grid">${rows}</div>` + (hits.length>600?`<div class="ti-sub" style="margin-top:8px">…他 ${hits.length-600} 件（絞り込んで表示）</div>`:'') + (hits.length?'':'<div class="empty">一致なし</div>');
  } else {
    const cat = CABINET.find(c => c.cat === cabCat) || CABINET[0];
    bodyHtml = cat.subs.map(s => {
      const total = s.items.length;
      const got = s.items.filter(it => S.cabinetGot[it.i]).length;
      let rows = cabSeriesRows(s.items);
      if (!cabShowGot) rows = rows.filter(r => {
        const cells = Object.values(r.cells).concat(r.noslot||[]);
        return !cells.every(it => S.cabinetGot[it.i]);
      });
      if (!rows.length) return '';
      const present = new Set(); rows.forEach(r => Object.keys(r.cells).forEach(k => present.add(k)));
      const cols = CAB_COLS.filter(c => present.has(c));
      const head = `<tr><th class="cab-h"></th>${cols.map(c=>`<th class="cab-h">${c}</th>`).join('')}</tr>`;
      const body = rows.map(r => {
        if (r.noslot && r.noslot.length){
          const it=r.noslot[0];
          return `<tr><th class="cab-series" colspan="${cols.length+1}" style="max-width:none"><span class="cab-c${S.cabinetGot[it.i]?' done':''}" style="display:inline-flex;vertical-align:middle" onclick="cabTog(${it.i})"><span class="cab-b">✓</span></span> <span style="color:var(--text3);font-weight:400">${cabEsc(it.n||('❓ 名称データ未提供 ID:'+it.i))}${it.x===2?' <span class="cab-w">ID</span>':''}</span></th></tr>`;
        }
        const cells = cols.map(c => r.cells[c] ? cabCell(r.cells[c]) : '<td></td>').join('');
        return `<tr><th class="cab-series" title="${cabEsc(r.label)}">${cabEsc(r.label)}</th>${cells}</tr>`;
      }).join('');
      return `<div class="sec-title">${s.sub}<span class="sec-cnt"><b>${got}</b>/${total}</span></div>
        <div style="overflow-x:auto"><table class="cab-grid">${head}${body}</table></div>`;
    }).join('') || '<div class="empty">表示するシリーズなし</div>';
  }

  document.getElementById('tab-cabinet').innerHTML = style + filterRow + bodyHtml;
}

  { id:'tr_anden',  name:'アンデン',         exp:'黄金', dailyMax:6, emoji:'🧑' },

  { id:'tr_kai',    name:'カイ・シル',       exp:'黄金', dailyMax:6, emoji:'🐍' },
  { id:'tr_adkira', name:'アドキラー',       exp:'黄金', dailyMax:6, emoji:'🧑' },
  { id:'tr_kurenai',name:'クレナイ',         exp:'黄金', dailyMax:6, emoji:'🧑' },
