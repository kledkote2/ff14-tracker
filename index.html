  { id:'tr_shiro',  name:'シロ・アリアポー', exp:'黄金', dailyMax:6, emoji:'🧑' },
];
const TRADE_MAX_HEARTS = 5;

const TRADE_INIT_HEARTS = { tr_marg:3, tr_anden:2, tr_ameri:5, tr_dura:5, tr_eltu:1, tr_kai:5, tr_adkira:5, tr_kurenai:5, tr_menago:4, tr_shiro:5 };
if (!S.tradeHearts) S.tradeHearts = {};
if (!S.tradeHeartsInited) {
  // 初回のみスクショの初期値をセット（既存値を上書き）
  TRADE_PARTNERS.forEach(p => { S.tradeHearts[p.id] = TRADE_INIT_HEARTS[p.id] ?? 0; });
  S.tradeHeartsInited = true;
}

function tradeAdd(id, delta) {
  const cur = S.tradeHearts[id] || 0;
  S.tradeHearts[id] = Math.max(0, Math.min(TRADE_MAX_HEARTS, cur + delta));
  save(); renderTrade();
}

function renderTrade() {
  const total = TRADE_PARTNERS.length;
  const maxed = TRADE_PARTNERS.filter(p=>(S.tradeHearts[p.id]||0)===TRADE_MAX_HEARTS).length;

  const header = `<div class="sec-title" style="margin-bottom:16px">
    お得意様取引 信頼ランク
    <span class="sec-cnt">MAX <b>${maxed}</b>/${total}</span>
  </div>`;

  const cards = TRADE_PARTNERS.map(p => {
    const hearts = S.tradeHearts[p.id] || 0;
    const heartStr = '♥'.repeat(hearts) + '♡'.repeat(TRADE_MAX_HEARTS - hearts);
    const color = hearts === TRADE_MAX_HEARTS ? '#f0d060' : hearts >= 3 ? '#c8a84b' : hearts >= 1 ? '#5b9bd5' : 'var(--text3)';

    return `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:12px 14px;display:flex;align-items:center;gap:12px;transition:border-color .12s"
      onmouseenter="this.style.borderColor='var(--border2)'" onmouseleave="this.style.borderColor='var(--border)'">
      <div style="font-size:13px;font-weight:500;flex:1">${p.name}</div>
      <span style="font-size:16px;color:${color};letter-spacing:2px;font-family:serif">${heartStr}</span>
      <button onclick="tradeAdd('${p.id}',1)" ${hearts>=TRADE_MAX_HEARTS?'disabled':''} style="font-family:var(--mono);font-size:13px;width:26px;height:26px;border-radius:50%;border:1px solid var(--accent2);background:${hearts>=TRADE_MAX_HEARTS?'var(--bg4)':'#0d1d35'};color:${hearts>=TRADE_MAX_HEARTS?'var(--text3)':'var(--accent)'};cursor:${hearts>=TRADE_MAX_HEARTS?'default':'pointer'};display:flex;align-items:center;justify-content:center">+</button>
      <button onclick="tradeAdd('${p.id}',-1)" style="font-family:var(--mono);font-size:13px;width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center">−</button>
    </div>`;
  }).join('');

  document.getElementById('tab-trade').innerHTML = header +
    `<div style="display:flex;flex-direction:column;gap:6px">${cards}</div>`;
}

  // 前提
  { id:'ph00', name:'クレセントアイル解放',              desc:'クエスト：ケテンラム、最後の冒険 → 無人の町（蜃気楼の町）' },

if (S.phantomStep === undefined) S.phantomStep = 0;

function renderPhantom() {
  const deadline = new Date('2026-07-28');
  const today = new Date(); today.setHours(0,0,0,0);
  const daysLeft = Math.ceil((deadline - today) / 86400000);
  const deadlineStr = daysLeft > 0 ? `残り <b style="color:var(--red)">${daysLeft}日</b>` : `<b style="color:var(--red)">期限切れ</b>`;

  const header = `<div class="sec-title" style="margin-bottom:8px">
    ファントムウェポン進捗
    <span class="sec-cnt">ステップ <b>${S.phantomStep}</b>/${PHANTOM_STEPS.length}</span>
  </div>
  <div style="font-family:var(--mono);font-size:11px;color:var(--text3);margin-bottom:20px">
    ⏰ 期限: 2026/7/28 &nbsp;·&nbsp; ${deadlineStr}
  </div>`;

  const steps = PHANTOM_STEPS.map((s, i) => {
    const done = i < S.phantomStep;
    const current = i === S.phantomStep;
    const color = done ? 'var(--green)' : current ? 'var(--accent)' : 'var(--border2)';
    const textColor = done ? 'var(--text3)' : current ? 'var(--text)' : 'var(--text3)';
    return `<div style="display:flex;gap:14px;align-items:flex-start;margin-bottom:14px">
      <div style="display:flex;flex-direction:column;align-items:center;gap:0">
        <div onclick="S.phantomStep=${done?i:current?i+1:S.phantomStep};save();renderPhantom()" style="width:20px;height:20px;border-radius:50%;border:2px solid ${color};background:${done?'var(--green2)':current?'#0d1d35':'transparent'};display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .2s">
          ${done?`<span style="color:var(--green);font-size:11px">✓</span>`:current?`<span style="width:8px;height:8px;border-radius:50%;background:var(--accent);display:block"></span>`:''}
        </div>
        ${i < PHANTOM_STEPS.length-1 ? `<div style="width:2px;height:20px;background:${done?'var(--green2)':'var(--border)'}"></div>` : ''}
      </div>
      <div style="padding-top:1px;opacity:${done?0.4:1}">
        <div style="font-size:13px;color:${textColor};${done?'text-decoration:line-through':''}">${s.name}</div>
        ${s.desc?`<div style="font-size:11px;color:var(--text3);margin-top:2px">${s.desc}</div>`:''}
      </div>
    </div>`;
  }).join('');

  const resetBtn = `<button onclick="S.phantomStep=0;save();renderPhantom()" style="margin-top:10px;font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:3px;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer">リセット</button>`;

  document.getElementById('tab-phantom').innerHTML = header + `<div style="padding:4px 0">${steps}</div>` + resetBtn;
}
