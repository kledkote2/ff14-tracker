<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF14 Tracker — こてつ</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0c0f;--bg2:#10141a;--bg3:#161c25;--bg4:#1c2533;
  --border:#1e2d42;--border2:#2a3f5a;
  --accent:#3d8bff;--accent2:#1a5cbf;
  --gold:#c8a84b;--gold2:#8a7030;
  --green:#2ecc71;--green2:#1a7a44;
  --red:#e74c3c;--red2:#7a2020;
  --text:#c8d4e4;--text2:#7a90aa;--text3:#4a5f75;
  --mono:'Share Tech Mono',monospace;
  --sans:'Zen Kaku Gothic New',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;min-height:100vh;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* HEADER */
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;}
.logo{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.1em;white-space:nowrap;}
.logo span{color:var(--gold);}
.nav{display:flex;gap:3px;flex:1;}
.nav-btn{background:none;border:1px solid transparent;color:var(--text2);padding:5px 13px;border-radius:4px;cursor:pointer;font-family:var(--sans);font-size:13px;transition:all .12s;white-space:nowrap;}
.nav-btn:hover{color:var(--text);border-color:var(--border2);background:var(--bg3);}
.nav-btn.active{color:var(--accent);border-color:var(--accent2);background:#0d1d35;}
.gp{font-family:var(--mono);font-size:11px;color:var(--text3);white-space:nowrap;}
.gp b{color:var(--green);}

/* MAIN */
.main{padding:18px 20px;max-width:1200px;margin:0 auto;}
.tab-content{display:none;}
.tab-content.active{display:block;}

/* SECTION */
.sec-title{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--text3);text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:7px;margin-bottom:10px;margin-top:22px;display:flex;justify-content:space-between;align-items:center;}
.sec-title:first-child{margin-top:0;}
.sec-cnt{font-size:11px;color:var(--text3);}
.sec-cnt b{color:var(--green);}

/* FILTER ROW */
.filter-row{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
.filter-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:4px 11px;border-radius:3px;cursor:pointer;font-size:12px;font-family:var(--sans);transition:all .12s;}
.filter-btn:hover{border-color:var(--border2);color:var(--text);}
.filter-btn.active{border-color:var(--accent2);color:var(--accent);background:#0d1d35;}
.show-done-toggle{margin-left:auto;font-size:12px;color:var(--text3);display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;}
.show-done-toggle input{accent-color:var(--accent);}

/* TODO */
.todo-grid{display:flex;flex-direction:column;gap:2px;margin-bottom:6px;}
.todo-item{display:flex;align-items:flex-start;gap:9px;padding:7px 9px;border-radius:4px;border:1px solid transparent;cursor:pointer;transition:all .12s;user-select:none;}
.todo-item:hover{background:var(--bg3);border-color:var(--border);}
.todo-item.done{opacity:.3;}
.todo-item.done .ti-name{text-decoration:line-through;}
.chk{width:15px;height:15px;border:1.5px solid var(--border2);border-radius:3px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .12s;}
.todo-item.done .chk{background:var(--green2);border-color:var(--green);}
.chk-mark{display:none;color:var(--green);font-size:10px;line-height:1;}
.todo-item.done .chk-mark{display:block;}
.ti-name{font-size:13px;color:var(--text);flex:1;}
.ti-sub{font-size:11px;color:var(--text3);margin-top:1px;}
.badge{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:3px;flex-shrink:0;margin-top:2px;}
.b-weekly{background:#0d1d35;color:var(--accent);border:1px solid var(--accent2);}
.b-once{background:#0d2a1a;color:var(--green);border:1px solid var(--green2);}
.b-ongoing{background:#2a1f08;color:var(--gold);border:1px solid var(--gold2);}

/* JOB TABLE */
.job-tbl{width:100%;border-collapse:collapse;}
.job-tbl th{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--text3);text-align:left;padding:6px 10px;border-bottom:1px solid var(--border);}
.job-tbl td{padding:6px 10px;border-bottom:1px solid #0e1520;font-size:13px;vertical-align:middle;}
.job-tbl tr:hover td{background:var(--bg3);}
.role-badge{font-size:10px;padding:2px 6px;border-radius:2px;font-family:var(--mono);display:inline-block;}
.r-tank  {background:#0d1a2a;color:#5b9bd5;border:1px solid #2a4a6a;}
.r-healer{background:#0d2a1a;color:#5bd58a;border:1px solid #2a6a44;}
.r-dps   {background:#2a0d0d;color:#d55b5b;border:1px solid #6a2a2a;}
.lv-bar-wrap{width:70px;height:4px;background:var(--bg4);border-radius:2px;display:inline-block;vertical-align:middle;margin-left:5px;}
.lv-bar{height:100%;border-radius:2px;transition:width .3s;}
.lv-gold{background:var(--gold);}
.lv-grn {background:var(--green);}
.lv-blu {background:var(--accent);}
.lv-red {background:var(--red);}
.lv-num{font-family:var(--mono);font-size:13px;}

/* Tier select */
.tier-sel{background:var(--bg4);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:11px;padding:3px 6px;border-radius:3px;cursor:pointer;transition:border-color .12s;width:100%;}
.tier-sel:hover{border-color:var(--border2);}
.tier-sel:focus{outline:none;border-color:var(--accent2);}

/* Job icon — circle fallback */
.job-icon-wrap{display:flex;align-items:center;gap:8px;}
.job-icon{width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0;}
.job-icon-fb{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:0;border:1px solid;}

/* WEAPON TABLE */
.weapon-tbl{width:100%;border-collapse:collapse;}
.weapon-tbl th{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--text3);text-align:left;padding:5px 10px;border-bottom:1px solid var(--border);}
.weapon-tbl td{padding:6px 10px;border-bottom:1px solid #0e1520;font-size:13px;vertical-align:middle;}
.weapon-tbl tr:hover td{background:var(--bg3);}
.weapon-tbl tr.done-row{opacity:.35;}
.status-sel{background:var(--bg4);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:11px;padding:3px 6px;border-radius:3px;cursor:pointer;transition:border-color .12s;}
.status-sel:hover{border-color:var(--border2);}
.status-sel:focus{outline:none;border-color:var(--accent2);}
.note-input{background:none;border:none;color:var(--text2);font-family:var(--sans);font-size:12px;width:100%;outline:none;border-bottom:1px solid transparent;transition:border-color .12s;}
.note-input:hover,.note-input:focus{border-bottom-color:var(--border2);}

/* GLAMOUR */
.glamour-section{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:700px){.glamour-section{grid-template-columns:1fr;}}
.glam-card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.glam-header{background:var(--bg3);border-bottom:1px solid var(--border);padding:9px 13px;display:flex;align-items:center;gap:8px;}
.glam-job{font-weight:700;font-size:14px;}
.glam-cnt{font-family:var(--mono);font-size:11px;color:var(--text3);margin-left:auto;}
.glam-cnt b{color:var(--green);}
.glam-url{font-family:var(--mono);font-size:10px;color:var(--accent);text-decoration:none;}
.glam-url:hover{text-decoration:underline;}
.glam-piece{display:flex;align-items:center;gap:9px;padding:6px 13px;border-bottom:1px solid #0e1520;cursor:pointer;transition:background .1s;}
.glam-piece:last-child{border-bottom:none;}
.glam-piece:hover{background:var(--bg3);}
.glam-piece.done{opacity:.35;}
.glam-piece.done .gp-name{text-decoration:line-through;}
.gp-slot{font-family:var(--mono);font-size:10px;color:var(--text3);width:32px;flex-shrink:0;}
.gp-name{font-size:13px;flex:1;}
.gp-src{font-size:11px;color:var(--text3);}
.gp-chk{width:13px;height:13px;border-radius:2px;border:1px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.glam-piece.done .gp-chk{background:var(--green2);border-color:var(--green);}
.gp-chk-mark{display:none;color:var(--green);font-size:9px;line-height:1;}
.glam-piece.done .gp-chk-mark{display:block;}
/* SITES */
.sites-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.site-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;overflow:hidden;text-decoration:none;color:var(--text);display:flex;flex-direction:column;transition:all .15s;cursor:pointer;}
.site-card:hover{border-color:var(--border2);background:var(--bg3);transform:translateY(-2px);}
.site-thumb{width:100%;height:100px;object-fit:cover;display:block;background:var(--bg4);}
.site-thumb-fb{width:100%;height:100px;display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--bg4);flex-shrink:0;}
.site-body{padding:10px 12px;flex:1;display:flex;flex-direction:column;gap:4px;}
.site-name{font-size:13px;font-weight:500;color:var(--text);}
.site-url{font-family:var(--mono);font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.site-desc{font-size:12px;color:var(--text2);line-height:1.5;margin-top:2px;}
.site-tag{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:2px;display:inline-block;margin-top:auto;align-self:flex-start;}
.st-wiki    {background:#0d1d35;color:var(--accent);border:1px solid var(--accent2);}
.st-tool    {background:#0d2a1a;color:var(--green);border:1px solid var(--green2);}
.st-market  {background:#2a1f08;color:var(--gold);border:1px solid var(--gold2);}
.st-glam    {background:#2a0d2a;color:#c882e8;border:1px solid #7a3a8a;}
.st-craft   {background:#0d2a2a;color:#5bd5d5;border:1px solid #2a6a6a;}
.st-hunt    {background:#2a0d0d;color:var(--red);border:1px solid var(--red2);}
.st-blue    {background:#1a1208;color:#e8c45b;border:1px solid #8a6a2a;}
.st-end     {background:#1a0a2a;color:#c882e8;border:1px solid #7a3a8a;}
#modal-body label{display:block;font-family:var(--mono);font-size:11px;color:var(--text3);margin-bottom:4px;}
</style>
</head>
<body>

<div class="header">
  <div class="logo">FF14 <span>TRACKER</span> // こてつ</div>
  <nav class="nav">
    <button class="nav-btn active" onclick="switchTab('todo',this)">やることリスト</button>
    <button class="nav-btn" onclick="switchTab('jobs',this)">ジョブ</button>
    <button class="nav-btn" onclick="switchTab('weapons',this)">光る武器</button>
    <button class="nav-btn" onclick="switchTab('glamour',this)">ミラプリ</button>
    <button class="nav-btn" onclick="switchTab('sites',this)">便利サイト</button>
    <button class="nav-btn" onclick="switchTab('beast',this)">蛮族</button>
    <button class="nav-btn" onclick="switchTab('bluemage',this)">青魔法</button>
    <button class="nav-btn" onclick="switchTab('seals',this)">記章交換</button>
    <button class="nav-btn" onclick="switchTab('orchestrion',this)">オーケストリオン</button>
  </nav>
  <div class="gp" id="gp">—</div>
  <span id="sync-status" style="font-family:var(--mono);font-size:11px;margin-left:8px"></span>
  <button onclick="cloudLoad()" style="background:none;border:1px solid var(--border);color:var(--text3);font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:3px;cursor:pointer;margin-left:4px" title="クラウドから読み込み">↓ 読込</button>
</div>

<div class="main">
  <div class="tab-content active" id="tab-todo"></div>
  <div class="tab-content" id="tab-jobs"></div>
  <div class="tab-content" id="tab-weapons"></div>
  <div class="tab-content" id="tab-glamour"></div>
  <div class="tab-content" id="tab-sites"></div>
  <div class="tab-content" id="tab-beast"></div>
  <div class="tab-content" id="tab-bluemage"></div>
  <div class="tab-content" id="tab-seals"></div>
  <div class="tab-content" id="tab-orchestrion"></div>
</div>

<!-- MODAL -->
<div id="modal-overlay" onclick="if(event.target===this)closeModal()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center">
  <div style="background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:20px 24px;min-width:320px;max-width:460px;width:90%">
    <div style="font-size:15px;font-weight:500;margin-bottom:16px;color:var(--text)" id="modal-title">編集</div>
    <div id="modal-body"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button onclick="closeModal()" style="background:var(--bg3);border:1px solid var(--border2);color:var(--text2);padding:6px 16px;border-radius:4px;cursor:pointer;font-family:var(--sans);font-size:13px">キャンセル</button>
      <button id="modal-save-btn" style="background:var(--accent2);border:1px solid var(--accent);color:#fff;padding:6px 16px;border-radius:4px;cursor:pointer;font-family:var(--sans);font-size:13px">保存</button>
    </div>
  </div>
</div>

<script>
// ==================== TIER DEFS ====================
const TIERS = [

// abbr: fallback initials for the circle badge

// Icon URL candidates — browser will try first, fallback to initials badge via JS
function iconUrl(slug) {
  return `https://ffxivteamcraft.com/assets/icons/classjob/${slug}.png`;
}

// ==================== TODO DATA (初期値) ====================
const TODOS_DEFAULT = [

// Weekly reset tracking: store ISO week string "YYYY-Www"
function isoWeek() {
  const d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 3 - (d.getDay()+6)%7);
  const w = new Date(d.getFullYear(),0,4);
  return d.getFullYear()+'W'+String(Math.round(((d-w)/86400000-3+(w.getDay()+6)%7)/7)+1).padStart(2,'0');
}
if (S.lastWeek !== isoWeek()) {
  // auto-reset weekly items on new week
  S.todos.forEach(t => { if (t.type==='weekly') delete S[t.id]; });
  S.lastWeek = isoWeek();
}
// ==================== CLOUD SYNC ====================
// デプロイ後にWorkerのURLを設定する
const WORKER_URL = 'https://ff14-tracker-sync.kote2-89f.workers.dev';

let syncStatus = 'idle'; // idle / syncing / ok / error
let syncTimer = null;

function save() {
  localStorage.setItem('ff14t_v3', JSON.stringify(S));
  // Worker URLが設定されていたら自動クラウド同期（debounce 2秒）
  if (WORKER_URL) {
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => cloudSync(), 2000);
    setSyncStatus('pending');
  }
}

function setSyncStatus(s) {
  syncStatus = s;
  const el = document.getElementById('sync-status');
  if (!el) return;
  const map = {
    idle:    { text:'', color:'var(--text3)' },
    pending: { text:'● 保存待ち', color:'var(--gold)' },
    syncing: { text:'↑ 同期中…', color:'var(--accent)' },
    ok:      { text:'✓ 同期済み', color:'var(--green)' },
    error:   { text:'✕ 同期失敗', color:'var(--red)' },
  };
  const m = map[s] || map.idle;
  el.textContent = m.text;
  el.style.color = m.color;
}

async function cloudSync() {
  if (!WORKER_URL) return;
  setSyncStatus('syncing');
  try {
    // Stateをフラットなkey-valueに変換（巨大なtodos/glamoursはJSON文字列化）
    const payload = {};
    for (const [k, v] of Object.entries(S)) {
      payload[k] = typeof v === 'object' ? JSON.stringify(v) : String(v);
    }
    const res = await fetch(`${WORKER_URL}/sync`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error(res.status);
    setSyncStatus('ok');
  } catch(e) {
    setSyncStatus('error');
  }
}

async function cloudLoad() {
  if (!WORKER_URL) return;
  setSyncStatus('syncing');
  try {
    const res = await fetch(`${WORKER_URL}/sync`);
    const data = await res.json();
    for (const [k, {value}] of Object.entries(data)) {
      // JSON文字列かどうか判定して復元
      try { S[k] = JSON.parse(value); }
      catch { S[k] = value === 'true' ? true : value === 'false' ? false : value; }
    }
    localStorage.setItem('ff14t_v3', JSON.stringify(S));
    setSyncStatus('ok');
    renderAll();
  } catch(e) {
    setSyncStatus('error');
  }
}

  </div>`;

  const filteredCats = todoFilter==='all'?cats:[todoFilter];
  const sections = filteredCats.map(cat=>{
    const allCat = TODOS.filter(t=>t.cat===cat);
    const items  = allCat.filter(t=>showDoneTodo||!S[t.id]);
    if (!items.length) return '';
    const done = allCat.filter(t=>S[t.id]).length;
    const rows = items.map(t=>`
      <div class="todo-item${S[t.id]?' done':''}">
        <div class="chk" onclick="toggle('${t.id}')" style="cursor:pointer"><span class="chk-mark">✓</span></div>

        <span class="badge b-${t.type}" style="cursor:pointer" title="クリックで編集" onclick="todoEdit('${t.id}')">${t.type==='weekly'?'週次':t.type==='once'?'一回':'継続'}</span>

      </div>`).join('');
    return `<div class="sec-title">${cat}<span class="sec-cnt"><b>${done}</b>/${allCat.length}</span></div>

  }).join('');

}

      const tierOpts = TIERS.map(t=>
        `<option value="${t.v}"${tier===t.v?' selected':''}>${t.v}. ${t.label}</option>`
      ).join('');

      return `<tr>
        <td>
          <div class="job-icon-wrap">
            ${iconHtml}
            <span>${j.name}</span>
          </div>
        </td>
        <td style="white-space:nowrap">
          <span class="role-badge r-${j.role}">${roleLabel[j.role]}</span>
        </td>
        <td style="white-space:nowrap">
          <span class="lv-num">${lv}</span>
          <span class="lv-bar-wrap"><span class="lv-bar ${lvCls}" style="width:${pct}%"></span></span>
        </td>
        <td style="font-family:var(--mono);font-size:12px;color:var(--text3)">${j.target}</td>
        <td style="min-width:160px">
          <select class="tier-sel" style="color:${td.color}"
            onchange="S['tier_${j.id}']=parseInt(this.value);save();renderJobs()">
            ${tierOpts}
          </select>
        </td>
      </tr>`;
    }).join('');

    html += `
      <div class="sec-title">${roleLabel[role]}</div>
      <table class="job-tbl" style="margin-bottom:8px">
        <tr>
          <th style="width:160px">ジョブ</th>
          <th style="width:90px">ロール</th>
          <th style="width:140px">レベル</th>
          <th style="width:60px">目標</th>
          <th>Tier</th>
        </tr>
        ${rows}
      </table>`;
  });

  const btn = `<div style="display:flex;justify-content:flex-end;margin-bottom:10px">
    <button id="lodestone-btn" onclick="lodestoneSync()"
      style="background:none;border:1px solid var(--border2);color:var(--text2);font-family:var(--mono);font-size:11px;padding:5px 12px;border-radius:4px;cursor:pointer;transition:all .12s"
      onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text2)'">
      ↓ Lodestoneから更新
    </button>
  </div>`;
  document.getElementById('tab-jobs').innerHTML = btn + html;
}

const LODESTONE_ID = '28199963';
const LODESTONE_NAME_MAP = {
  'ナイト':'j_pld','戦士':'j_war','暗黒騎士':'j_drk','ガンブレイカー':'j_gnb',
  '白魔道士':'j_whm','学者':'j_sch','占星術師':'j_ast','賢者':'j_sge',
  '竜騎士':'j_drg','モンク':'j_mnk','侍':'j_sam','忍者':'j_nin',
  'リーパー':'j_rpr','ヴァイパー':'j_vpr','吟遊詩人':'j_brd','機工士':'j_mch',
  '踊り子':'j_dnc','黒魔道士':'j_blm','召喚士':'j_smn','赤魔道士':'j_rdm',
  'ピクトマンサー':'j_pct','魔獣使い':'j_bst','青魔道士':'j_blu'
};

async function lodestoneSync() {
  const btn = document.getElementById('lodestone-btn');
  if (btn) btn.textContent = '↓ 取得中…';
  try {
    const res = await fetch(`${WORKER_URL}/lodestone/${LODESTONE_ID}`);
    const data = await res.json();
    if (!data.ok) throw new Error('failed');
    let updated = 0;
    for (const [name, lv] of Object.entries(data.jobs)) {
      const id = LODESTONE_NAME_MAP[name];
      if (id) { S['lv_'+id] = lv; updated++; }
    }
    save();
    renderJobs();
    if (btn) btn.textContent = `✓ ${updated}ジョブ更新`;
    setTimeout(() => { if (btn) btn.textContent = '↓ Lodestoneから更新'; }, 3000);
  } catch(e) {
    if (btn) btn.textContent = '✕ 取得失敗';
    setTimeout(() => { if (btn) btn.textContent = '↓ Lodestoneから更新'; }, 3000);
  }
}

// ==================== WEAPONS ====================
// sort: 'role'=ロール別(default), 'status'=ステータス別
let weaponSort = 'role';

function renderWeapons() {
  const SC = {todo:'color:var(--red)',wip:'color:var(--gold)',done:'color:var(--green)'};
  const SL = {todo:'未着手',wip:'仕掛中',done:'完了'};
  // status sort order: wip first, then todo, then done
  const SO = {wip:0, todo:1, done:2};

  const doneCount = WEAPONS.filter(w=>(S['ws_'+w.id]||w.status)==='done').length;

  const sortBtns = `<div class="filter-row" style="margin-bottom:14px">
    <span style="font-family:var(--mono);font-size:11px;color:var(--text3);margin-right:4px">並び順:</span>
    <button class="filter-btn${weaponSort==='role'?' active':''}" onclick="weaponSort='role';renderWeapons()">ロール別</button>
    <button class="filter-btn${weaponSort==='status'?' active':''}" onclick="weaponSort='status';renderWeapons()">ステータス別</button>
  </div>`;

  let html = `<div class="sec-title">光る武器進捗<span class="sec-cnt"><b>${doneCount}</b>/${WEAPONS.length} 完了</span></div>
  ${sortBtns}`;

  function makeRow(w) {
    const status = S['ws_'+w.id] || w.status;
    const note   = S['wn_'+w.id]  !== undefined ? S['wn_'+w.id]  : w.note;
    const series = S['wsr_'+w.id] !== undefined ? S['wsr_'+w.id] : w.series;
    const isDone = S[w.id]||false;
    return `<tr class="${isDone?'done-row':''}">
      <td>
        <div style="display:flex;align-items:center;gap:7px;cursor:pointer" onclick="toggle('${w.id}')">
          <div class="chk" style="flex-shrink:0"><span class="chk-mark" style="${isDone?'display:block':''}">✓</span></div>
          ${w.job}
        </div>
      </td>
      <td>
        <input class="note-input" style="color:var(--text2);width:120px" value="${series.replace(/"/g,'&quot;')}"
          onblur="S['wsr_${w.id}']=this.value;save()"
          onkeydown="if(event.key==='Enter')this.blur()">
      </td>
      <td>
        <select class="status-sel" style="${SC[status]}"
          onchange="S['ws_${w.id}']=this.value;save();renderWeapons()">
          ${['todo','wip','done'].map(s=>`<option value="${s}"${status===s?' selected':''}>${SL[s]}</option>`).join('')}
        </select>
      </td>
      <td>
        <input class="note-input" value="${note.replace(/"/g,'&quot;')}"
          onblur="S['wn_${w.id}']=this.value;save()"
          onkeydown="if(event.key==='Enter')this.blur()">
      </td>
    </tr>`;
  }

  if (weaponSort === 'role') {
    const roleLabel = {tank:'TANK', healer:'HEALER', dps:'DPS'};
    ['tank','healer','dps'].forEach(role => {
      const group = WEAPONS.filter(w=>w.role===role);
      const doneCnt = group.filter(w=>(S['ws_'+w.id]||w.status)==='done').length;
      html += `
        <div class="sec-title" style="margin-top:18px">${roleLabel[role]}
          <span class="sec-cnt"><b>${doneCnt}</b>/${group.length}</span>
        </div>
        <table class="weapon-tbl">
          <tr><th style="width:130px">ジョブ</th><th style="width:130px">シリーズ</th><th style="width:110px">ステータス</th><th>メモ</th></tr>
          ${group.map(makeRow).join('')}
        </table>`;
    });
  } else {
    // group by status: wip → todo → done
    const statusLabel = {wip:'仕掛中', todo:'未着手', done:'完了'};
    const statusColor = {wip:'var(--gold)', todo:'var(--red)', done:'var(--green)'};
    ['wip','todo','done'].forEach(st => {
      const group = WEAPONS.filter(w=>(S['ws_'+w.id]||w.status)===st);
      if (!group.length) return;
      html += `
        <div class="sec-title" style="margin-top:18px;color:${statusColor[st]}">${statusLabel[st]}
          <span class="sec-cnt" style="color:${statusColor[st]}">${group.length} 件</span>
        </div>
        <table class="weapon-tbl">
          <tr><th style="width:130px">ジョブ</th><th style="width:130px">シリーズ</th><th style="width:110px">ステータス</th><th>メモ</th></tr>
          ${group.map(makeRow).join('')}
        </table>`;
    });
  }

  document.getElementById('tab-weapons').innerHTML = html;
}

  document.getElementById('modal-save-btn').onclick = () => {
    p.slot   = document.getElementById('gp-slot').value;
    p.name   = document.getElementById('gp-name').value.trim();
    p.color  = document.getElementById('gp-color').value.trim() || 'デフォルト';
    p.source = document.getElementById('gp-src').value.trim();
    save(); closeModal(); renderGlamour();
  };
}

function glamDeletePiece(gid, pi) {
  const g = S.glamours.find(x=>x.id===gid);
  // remove check state for this piece and re-index subsequent pieces
  const oldKey = gid+'_p'+pi;
  delete S[oldKey];
  // shift down higher indices
  for (let i=pi+1; i<g.pieces.length; i++) {
    S[gid+'_p'+(i-1)] = S[gid+'_p'+i];
    delete S[gid+'_p'+i];
  }
  g.pieces.splice(pi,1);
  save(); closeModal(); renderGlamour(); renderGP();
}

function renderGlamour() {
  const addBtn = `<div style="margin-bottom:14px">

  </div>`;

  const cards = S.glamours.map(g=>{
    const dp = g.pieces.filter((_,i)=>S[g.id+'_p'+i]).length;
    const pieces = g.pieces.map((p,i)=>`
      <div class="glam-piece${S[g.id+'_p'+i]?' done':''}">
        <div class="gp-chk" onclick="toggle('${g.id}_p${i}')" style="cursor:pointer"><span class="gp-chk-mark">✓</span></div>
        <span class="gp-slot" style="cursor:pointer" onclick="toggle('${g.id}_p${i}')">${p.slot}</span>
        <div style="flex:1;cursor:pointer" onclick="toggle('${g.id}_p${i}')">
          <div class="gp-name">${p.name}</div>
          ${p.color!=='デフォルト'||p.source?`<div class="gp-src">${[p.color!=='デフォルト'?p.color:'',p.source||''].filter(Boolean).join(' / ')}</div>`:''}
        </div>
        <button onclick="glamEditPiece('${g.id}',${i})" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;padding:0 4px" title="部位を編集">✎</button>
      </div>`).join('');

    return `<div class="glam-card">
      <div class="glam-header">
        <span class="glam-job">${g.job}</span>
        <span class="glam-cnt"><b>${dp}</b>/${g.pieces.length}</span>
        <button onclick="glamAddPiece('${g.id}')" style="background:none;border:none;color:var(--green);cursor:pointer;font-size:18px;line-height:1;padding:0 4px" title="部位を追加">＋</button>
        <button onclick="glamEditSet('${g.id}')" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;padding:0 4px" title="コーデを編集">✎</button>
        ${g.url?`<a class="glam-url" href="${g.url}" target="_blank" onclick="event.stopPropagation()">↗ 参照</a>`:''}
      </div>
      <div>${pieces}</div>
    </div>`;
  }).join('');

  document.getElementById('tab-glamour').innerHTML = addBtn +
    `<div class="glamour-section">${cards}</div>`;
}

let siteFilter = 'all';

function renderSites() {
  const cats = [...new Set(SITES.map(s=>s.cat))];
  const tagClass = {wiki:'st-wiki',tool:'st-tool',market:'st-market',glam:'st-glam',craft:'st-craft',hunt:'st-hunt',blue:'st-blue',end:'st-end'};
  const tagLabel = {wiki:'WIKI',tool:'TOOL',market:'MARKET',glam:'GLAM',craft:'CRAFT',hunt:'HUNT',blue:'BLUE MAGE',end:'HIGH-END'};

  const filters = `<div class="filter-row" style="margin-bottom:18px">
    ${['all',...cats].map(c=>`<button class="filter-btn${siteFilter===c?' active':''}" onclick="siteFilter='${c}';renderSites()">${c==='all'?'すべて':c}</button>`).join('')}
  </div>`;

  const shown = siteFilter==='all' ? SITES : SITES.filter(s=>s.cat===siteFilter);

  // group by cat when showing all
  let cardsHtml = '';
  if (siteFilter === 'all') {
    cats.forEach(cat => {
      const group = shown.filter(s=>s.cat===cat);
      cardsHtml += `<div class="sec-title" style="margin-top:20px">${cat}</div>
        <div class="sites-grid" style="margin-bottom:8px">
          ${group.map(s=>siteCard(s,tagClass,tagLabel)).join('')}
        </div>`;
    });
  } else {
    cardsHtml = `<div class="sites-grid">${shown.map(s=>siteCard(s,tagClass,tagLabel)).join('')}</div>`;
  }

  document.getElementById('tab-sites').innerHTML = filters + cardsHtml;
}

function siteCard(s, tagClass, tagLabel) {
  // Use Google favicon service for thumbnails (works from any browser)
  const favicon = `https://www.google.com/s2/favicons?sz=64&domain_url=${encodeURIComponent(s.url)}`;
  return `<a class="site-card" href="${s.url}" target="_blank" rel="noopener">
    <div class="site-thumb-fb" style="position:relative">
      <span style="font-size:36px">${s.emoji}</span>
      <img src="${favicon}" alt="" style="position:absolute;bottom:6px;right:8px;width:20px;height:20px;border-radius:4px;background:var(--bg2)" onerror="this.style.display='none'">
    </div>
    <div class="site-body">
      <div class="site-name">${s.name}</div>
      <div class="site-url">${s.url.replace('https://','').replace('http://','')}</div>
      <div class="site-desc">${s.desc}</div>
      <span class="site-tag ${tagClass[s.tag]}">${tagLabel[s.tag]}</span>
    </div>
  </a>`;
}

// ランク → 進捗数値（0-6）
function rankIdx(r) { return RANKS.indexOf(r); }

function renderBeast() {
  const exps = [...new Set(BEASTS_DEFAULT.map(b=>b.exp))];
  const typeLabel = { battle:'⚔️ 戦闘', craft:'🔨 クラフター', gather:'🌿 ギャザラー' };
  const typeFilter = ['all','battle','craft','gather'];

  // filter state
  if (renderBeast._filter === undefined) renderBeast._filter = 'all';
  const f = renderBeast._filter;

  const filterRow = `<div class="filter-row" style="margin-bottom:16px">
    ${typeFilter.map(t=>`<button class="filter-btn${f===t?' active':''}" onclick="renderBeast._filter='${t}';renderBeast()">${t==='all'?'すべて':typeLabel[t]}</button>`).join('')}
  </div>`;

  const total = BEASTS_DEFAULT.length;
  const allied = BEASTS_DEFAULT.filter(b=>S.beastRanks[b.id]==='誓約'||S.beastRanks[b.id]==='誓約★').length;
  const started = BEASTS_DEFAULT.filter(b=>S.beastRanks[b.id]!=='未解放').length;

  const header = `<div class="sec-title" style="margin-bottom:16px">
    蛮族クエスト進捗
    <span class="sec-cnt">誓約 <b>${allied}</b>/${total} &nbsp;|&nbsp; 開始済み <b>${started}</b>/${total}</span>
  </div>`;

  const sections = exps.map(exp => {
    const group = BEASTS_DEFAULT.filter(b => b.exp===exp && (f==='all' || b.type===f));
    if (!group.length) return '';

    const cards = group.map(b => {
      const rank = S.beastRanks[b.id] || '未解放';
      const ri = rankIdx(rank);
      const pct = Math.round(ri / (RANKS.length-1) * 100);
      const color = RANK_COLOR[rank];
      const rankOpts = RANKS.map(r=>`<option value="${r}"${rank===r?' selected':''}>${r}</option>`).join('');

      return `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;transition:border-color .12s"
        onmouseenter="this.style.borderColor='var(--border2)'" onmouseleave="this.style.borderColor='var(--border)'">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:20px">${b.emoji}</span>
          <div style="flex:1">
            <div style="font-size:13px;font-weight:500">${b.name}</div>
            <div style="font-size:11px;color:var(--text3);font-family:var(--mono)">${typeLabel[b.type]} &nbsp;·&nbsp; ${b.patch}</div>
          </div>
          <select style="background:var(--bg4);border:1px solid var(--border);color:${color};font-family:var(--mono);font-size:11px;padding:3px 6px;border-radius:3px;cursor:pointer"
            onchange="S.beastRanks['${b.id}']=this.value;save();renderBeast()">
            ${rankOpts}
          </select>
        </div>
        <div style="height:4px;background:var(--bg4);border-radius:2px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${color};border-radius:2px;transition:width .3s"></div>
        </div>
        <div style="font-size:11px;color:var(--text3)">報酬: ${b.reward}</div>
      </div>`;
    }).join('');

    const expAllied = group.filter(b=>S.beastRanks[b.id]==='誓約'||S.beastRanks[b.id]==='誓約★').length;
    return `<div class="sec-title" style="margin-top:20px">${exp}
      <span class="sec-cnt">誓約 <b>${expAllied}</b>/${group.length}</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:4px">
      ${cards}
    </div>`;
  }).join('');

  document.getElementById('tab-beast').innerHTML = header + filterRow + sections;
}

let blueFilter = 'all'; // all/unlearned/attack/heal/support/special
let blueSearch = '';

function renderBlueMage() {
  const catLabel = {attack:'⚔️ 攻撃', heal:'💚 回復', support:'🛡️ サポート'};
  const learned = BLUE_SPELLS.filter(s => S.blueLearned[s.no]).length;

  const filterRow = `<div class="filter-row" style="margin-bottom:8px">
    ${['all','unlearned','attack','heal','support'].map(f=>`
      <button class="filter-btn${blueFilter===f?' active':''}" onclick="blueFilter='${f}';renderBlueMage()">
        ${f==='all'?'すべて':f==='unlearned'?'未習得':catLabel[f]}
      </button>`).join('')}
  </div>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
    <input class="search-bar" style="max-width:280px;margin-bottom:0" placeholder="魔法名 / 入手先で検索…"
      value="${blueSearch}" oninput="blueSearch=this.value;renderBlueMage()">
    <span style="font-family:var(--mono);font-size:12px;color:var(--text3)">習得 <b style="color:var(--green)">${learned}</b>/124</span>
    <button class="filter-btn" onclick="if(confirm('全チェックをリセットしますか？')){S.blueLearned={};save();renderBlueMage()}" style="color:var(--red);border-color:var(--red2);margin-left:auto">リセット</button>
  </div>`;

  const shown = BLUE_SPELLS.filter(s => {
    if (blueFilter === 'unlearned' && S.blueLearned[s.no]) return false;
    if (['attack','heal','support'].includes(blueFilter) && s.cat !== blueFilter) return false;
    if (blueSearch) {
      const q = blueSearch.toLowerCase();
      return s.name.includes(q) || s.src.toLowerCase().includes(q);
    }
    return true;
  });

  // group by patch
  const patches = [
    {label:'Patch 4.5（No.1-49）',   from:1,   to:49},
    {label:'Patch 5.15（No.50-80）',  from:50,  to:80},
    {label:'Patch 5.45（No.81-104）', from:81,  to:104},
    {label:'Patch 6.45（No.105-124）',from:105, to:124},
  ];

  const sections = patches.map(p => {
    const group = shown.filter(s => s.no >= p.from && s.no <= p.to);
    if (!group.length) return '';
    const pLearned = BLUE_SPELLS.filter(s=>s.no>=p.from&&s.no<=p.to&&S.blueLearned[s.no]).length;
    const pTotal   = BLUE_SPELLS.filter(s=>s.no>=p.from&&s.no<=p.to).length;
    const rows = group.map(s => `
      <div class="todo-item${S.blueLearned[s.no]?' done':''}" onclick="S.blueLearned[${s.no}]=!S.blueLearned[${s.no}];save();renderBlueMage()">
        <div class="chk"><span class="chk-mark">✓</span></div>
        <div style="flex:1">
          <div class="ti-name"><span style="font-family:var(--mono);color:var(--text3);font-size:11px;margin-right:6px">${String(s.no).padStart(3,'0')}</span>${s.name}</div>
          <div class="ti-sub">${s.src}</div>
        </div>
        <span class="badge b-${s.cat==='attack'?'high':s.cat==='heal'?'once':'ongoing'}">${s.cat==='attack'?'攻撃':s.cat==='heal'?'回復':'サポート'}</span>
      </div>`).join('');
    return `<div class="sec-title">${p.label}<span class="sec-cnt"><b>${pLearned}</b>/${pTotal}</span></div>
            <div class="todo-grid">${rows}</div>`;
  }).join('');

  document.getElementById('tab-bluemage').innerHTML = filterRow + (sections || '<div class="empty">条件に一致する青魔法なし</div>');
}

        </div>
        <span class="badge" style="background:${typeColor[i.type]}22;color:${typeColor[i.type]};border:1px solid ${typeColor[i.type]}55">${i.type}</span>
      </div>`).join('');
    return `<div class="sec-title">${curr}記章<span class="sec-cnt"><b>${currGot}</b>/${currTotal}</span></div>
            <div class="todo-grid">${rows}</div>`;
  }).join('');

  document.getElementById('tab-seals').innerHTML = filters + (sections || '<div class="empty">条件に一致するアイテムなし</div>');
}

if (!S.orchGot) {
  S.orchGot = {};
  // すべてのIDをデフォルト未取得にしてから、スプレッドシートTRUEに一致するものをONにする
  const ORCH_GOT_INIT = ['or001','or002','or003','or004','or005','or006','or007','or008','or009','or010','or011','or012','or013','or014','or015','or016','or017','or018','or019','or020','or021','or022','or023','or024','or025','or026','or027','or028','or029','or030','or031','or032','or033','or034','or035','or036','or037','or038','or039','or040','or041','or042','or043','or044','or045','or046','or047','or048','or049','or050','or051','or052','or053','or054','or055','or056','or057','or058','or059','or060','or061','or062','or063','or064','or065','or066','or067','or068','or069','or070','or071','or072','or073','or074','or075','or076','or077','or078','or079','or080','or081','or082','or083','or084','or085','or086','or087','or088','or089','or090','or091','or092','or093','or094','or095','or096','or097','or098','or099','or100','or101','or102','or103','or104','or105','or106','or107','or108','or109','or110','or111','or112','or113','or114','or115','or116','or117','or118','or119','or120','or121','or122','or123','or124','or125','or126','or127','or128','or129','or130','or131','or132','or133','or134','or135','or136','or137','or138','or139','or140','or141','or142','or143','or144','or145','or146','or147','or148','or149'];
  ORCH_GOT_INIT.forEach(id => { S.orchGot[id] = true; });
}

let orchExpFilter = 'all';
let orchSearch = '';

function renderOrchstrion() {
  const exps = [...new Set(ORCH_ROLLS.map(r=>r.exp))];
  const got = ORCH_ROLLS.filter(r=>S.orchGot[r.id]).length;

  const filterRow = `<div class="filter-row" style="margin-bottom:8px">
    ${['all',...exps].map(e=>`<button class="filter-btn${orchExpFilter===e?' active':''}" onclick="orchExpFilter='${e}';renderOrchstrion()">${e==='all'?'すべて':e}</button>`).join('')}
  </div>
  <div style="display:flex;gap:10px;margin-bottom:14px;align-items:center">
    <input class="search-bar" style="max-width:300px;margin-bottom:0" placeholder="曲名 / 入手先で検索…"
      value="${orchSearch}" oninput="orchSearch=this.value;renderOrchstrion()">
    <span style="font-family:var(--mono);font-size:12px;color:var(--text3)">入手済み <b style="color:var(--green)">${got}</b>/${ORCH_ROLLS.length}</span>
  </div>`;

  const shown = ORCH_ROLLS.filter(r => {
    if (orchExpFilter !== 'all' && r.exp !== orchExpFilter) return false;
    if (orchSearch) {
      const q = orchSearch.toLowerCase();
      return r.name.toLowerCase().includes(q) || r.src.includes(q);
    }
    return true;
  });

  const sections = exps.filter(e=>orchExpFilter==='all'||e===orchExpFilter).map(exp => {
    const group = shown.filter(r=>r.exp===exp);
    if (!group.length) return '';
    const expGot   = ORCH_ROLLS.filter(r=>r.exp===exp&&S.orchGot[r.id]).length;
    const expTotal = ORCH_ROLLS.filter(r=>r.exp===exp).length;
    const rows = group.map(r => `
      <div class="todo-item${S.orchGot[r.id]?' done':''}" onclick="S.orchGot['${r.id}']=!S.orchGot['${r.id}'];save();renderOrchstrion()">
        <div class="chk"><span class="chk-mark">✓</span></div>
        <div style="flex:1">
          <div class="ti-name">🎵 ${r.name}</div>
          <div class="ti-sub">${r.src}</div>
        </div>
      </div>`).join('');
    return `<div class="sec-title">${exp}<span class="sec-cnt"><b>${expGot}</b>/${expTotal}</span></div>
            <div class="todo-grid">${rows}</div>`;
  }).join('');

  document.getElementById('tab-orchestrion').innerHTML = filterRow + (sections || '<div class="empty">条件に一致する譜面なし</div>');
}

// ==================== INIT ====================
renderAll();
</script>
</body>
</html>
